PN","L2TP/IPSec"],"f":[],"cf":false,"e":"OpenVPN se destaca por seguridad y flexibilidad; IKEv2/IPSec por estabilidad y reconexión."},{"id":"86cf13e34c","t":9,"q":"¿Cuál es el orden correcto del proceso DHCP?","c":"DISCOVER, OFFER, REQUEST, ACK.","d":["REQUEST, OFFER, DISCOVER, ACK.","DISCOVER, REQUEST, OFFER, ACK.","OFFER, DISCOVER, ACK, REQUEST."],"f":[],"cf":false,"e":"El cliente busca (DISCOVER, broadcast), el servidor ofrece (OFFER, unicast), el cliente pide (REQUEST) y el servidor confirma (ACK) con el lease."},{"id":"ab6fd99854","t":9,"q":"¿Qué mensaje DHCP se envía por broadcast según el material?","c":"DHCPDISCOVER","d":["DHCPOFFER","DHCPACK","Ninguno: DHCP solo usa unicast."],"f":[],"cf":false,"e":"El cliente todavía no conoce al servidor, por eso difunde. El OFFER es unicast."},{"id":"52b9ec7632","t":9,"q":"Inundar al servidor DHCP con peticiones REQUEST usando direcciones MAC falseadas para agotar su pool es un ataque de:","c":"DHCP Starvation.","d":["DHCP Spoofing.","DHCP Rogue Server.","DHCP ACK Injection."],"f":[],"cf":false,"e":"Spoofing y rogue server suplantan al servidor para cambiar la configuración de los clientes (MITM)."},{"id":"68481a621c","t":9,"q":"En DHCP snooping, un puerto untrusted (de usuario final) solo puede enviar:","c":"DHCPDiscover, DHCPRequest y DHCPRelease.","d":["DHCPOffer y DHCPAck.","Todos los mensajes DHCP, siempre que provengan de una MAC registrada.","Ningún mensaje DHCP."],"f":[],"cf":false,"e":"Se bloquean las respuestas de servidor (Offer, Ack, Nack) que llegan desde puertos de usuario."},{"id":"56a0ced5ca","t":9,"q":"ARP se encarga de:","c":"Encontrar la MAC que corresponde a una IP.","d":["Traducir nombres de dominio a direcciones IP.","Traducir IPs privadas a una IP pública.","Asignar direcciones IP de forma automática."],"f":[],"cf":false,"e":"Nombres a IP = DNS; privada a pública = NAT; asignación = DHCP."},{"id":"76d3ccad3f","t":9,"q":"¿Qué registro DNS relaciona una dirección IP con un nombre?","c":"PTR","d":["A","CNAME","MX"],"f":[],"cf":false,"e":"A es nombre a IP; PTR es el inverso. CNAME es alias y MX es servidor de correo."},{"id":"5d096ee672","t":9,"q":"¿En qué capa trabaja PAT?","c":"4 (Transporte).","d":["3 (Red).","2 (Enlace).","7 (Aplicación)."],"f":[],"cf":false,"e":"NAT trabaja en capa 3; PAT agrega puertos, por eso es capa 4."},{"id":"68e49cd645","t":9,"q":"Una dirección MAC tiene:","c":"48 bits.","d":["32 bits.","64 bits.","128 bits."],"f":[],"cf":false,"e":"32 bits es IPv4 y 128 bits es IPv6."},{"id":"01fa9d3fdd","t":9,"q":"La función del DNS es:","c":"Resolver nombres de dominio.","d":["Permitir la navegación web.","Transferir archivos entre equipos.","Enviar correos electrónicos."],"f":[],"cf":false,"e":"Navegar es HTTP, transferir archivos es FTP y enviar correo es SMTP. DNS es de capa de aplicación pero su función es la resolución de nombres."},{"id":"6a0b5b39ea","t":10,"q":"Se hace un backup full el domingo e incrementales de lunes a jueves. El viernes falla el servidor. ¿Qué se necesita para restaurar?","c":"El full del domingo y los incrementales de lunes, martes, miércoles y jueves.","d":["El full del domingo y solo el incremental del jueves.","Solo el incremental del jueves, porque tiene los cambios de toda la semana.","Solo el full del domingo."],"f":[],"cf":false,"e":"Cada incremental guarda solo lo que cambió desde la copia anterior: se necesitan todos, en orden."},{"id":"e48dae86a3","t":10,"q":"Se hace un backup full el domingo y diferenciales de lunes a jueves. El viernes falla el servidor. ¿Qué se necesita para restaurar?","c":"El full del domingo y el diferencial del jueves.","d":["El full del domingo y todos los diferenciales de la semana.","Solo el diferencial del jueves.","El diferencial del lunes y el del jueves."],"f":[],"cf":false,"e":"El diferencial acumula todo lo cambiado desde el último full."},{"id":"e6795ad7de","t":10,"q":"Un backup diferencial copia:","c":"Todo lo modificado desde el último backup completo.","d":["Todo lo modificado desde el último backup, sea completo o incremental.","La totalidad de los datos, pero comprimidos.","Solo los archivos nuevos, sin los modificados."],"f":[],"cf":false,"e":"La primera opción describe al incremental."},{"id":"26c3a37a65","t":10,"q":"¿Cuál es la ventaja del backup full según la Práctica?","c":"Es el más sencillo y rápido de restaurar.","d":["Es el que ocupa menos espacio, porque solo guarda los cambios del día.","Es el más rápido de ejecutar.","Es el que menos crece día a día."],"f":[],"cf":false,"e":"Su desventaja es que ocupa mucho espacio y tarda en ejecutarse."},{"id":"e05a84cf17","t":10,"q":"Una empresa hace un backup cada 4 horas. Eso define:","c":"Un RPO de 4 horas.","d":["Un RTO de 4 horas.","Un RPO y un RTO de 4 horas.","Una retención de 4 horas."],"f":[],"cf":false,"e":"RPO = cuántos datos (tiempo de trabajo) se aceptan perder. RTO = cuánto tiempo se puede estar caído."},{"id":"2da4ff7182","t":10,"q":"Una empresa tolera como máximo 2 horas con el sistema fuera de servicio mientras se restaura. Eso es:","c":"El RTO.","d":["El RPO.","La tasa de cambio diario.","La ventana de backup."],"f":[],"cf":false,"e":"RTO mira el tiempo de recuperación."},{"id":"5dfdfdda10","t":10,"q":"La regla 3-2-1 exige:","c":"3 copias de los datos, en 2 medios distintos, con 1 copia fuera del sitio.","d":["3 medios distintos, 2 copias de los datos y 1 copia en la nube.","3 copias fuera del sitio, 2 de ellas cifradas y 1 inmutable.","3 backups diarios, 2 semanales y 1 mensual."],"f":[],"cf":false,"e":"Las 3 copias incluyen el original. La última opción mezcla con GFS."},{"id":"5445fc98b2","t":10,"q":"En la regla 3-2-1-1-0, el \"0\" significa:","c":"Cero errores, verificados con pruebas de restauración.","d":["Cero copias en el mismo edificio que los servidores.","Cero conexión a la red de la copia offline.","Cero días de retención para los backups diarios."],"f":[],"cf":false,"e":"El segundo \"1\" es la copia inmutable u offline (air-gapped); el \"0\" es la verificación."},{"id":"75692d6dfc","t":10,"q":"En el esquema GFS, las copias \"Father\" son:","c":"Semanales, por lo general completas.","d":["Diarias, por lo general incrementales.","Mensuales, conservadas durante años.","Anuales, por requerimientos legales."],"f":[],"cf":false,"e":"Son = diaria (incremental), Father = semanal (full), Grandfather = mensual o anual."},{"id":"670ab95970","t":10,"q":"En backups, la confidencialidad de la tríada CIA se asegura mediante:","c":"El cifrado de las copias.","d":["Las pruebas periódicas de restauración.","La copia fuera del sitio.","La verificación de que los datos no fueron alterados."],"f":[],"cf":false,"e":"Integridad = datos no alterados; disponibilidad = poder restaurar a tiempo."},{"id":"3a1c44d61f","t":10,"q":"En un storage ExaGrid, la zona expuesta a la red que recibe los backups sin comprimir ni deduplicar es:","c":"La Landing Zone.","d":["La Repository Zone.","La zona inmutable.","La DMZ."],"f":[],"cf":false,"e":"La Repository (inmutable) está aislada de la red; ahí se deduplica, comprime y aplica inmutabilidad."},{"id":"cd2be72208","t":10,"q":"Al restaurar con Veeam, se recomienda restaurar en una ubicación nueva (New Location) porque:","c":"Permite probar el servidor restaurado sin pisar el original.","d":["Es la única opción que admite backups incrementales.","Evita tener que usar el backup full.","Es más rápido que restaurar en la ubicación original, porque no consolida incrementales."],"f":[],"cf":false,"e":"Si el backup tiene fallas, sobrescribir el original puede ser catastrófico."},{"id":"8a085820d4","t":10,"q":"¿Qué suele hacer un ransomware moderno antes de cifrar los datos de producción?","c":"Buscar los repositorios de backup y borrar las shadow copies.","d":["Hacer un backup completo para poder devolver los datos al pagar.","Desactivar el cifrado de los discos para trabajar más rápido.","Enviar la nota de rescate para medir la reacción de la víctima."],"f":[],"cf":false,"e":"El atacante pasa días en la red para destruir las copias; por eso se usan backups inmutables y segmentación."},{"id":"fa771a0cb5","t":10,"q":"La tasa de cambio diario es un dato clave para:","c":"Dimensionar el tamaño de los backups incrementales o diferenciales.","d":["Definir el RTO, es decir, cuánto tiempo puede estar caído el sistema.","Elegir el algoritmo de cifrado de las copias.","Decidir cuántas copias exige la regla 3-2-1."],"f":[],"cf":false,"e":"Es el volumen de datos modificado por día."},{"id":"934e9b302e","t":10,"q":"¿Qué herramienta de backup provee hardware especializado con niveles de retención?","c":"ExaGrid","d":["Veeam Backup & Replication","Vinchin","Wireshark"],"f":[],"cf":false,"e":"Veeam es el software estándar de la industria y Vinchin una solución ágil para motores de virtualización alternativos."},{"id":"ba9111ced9","t":10,"q":"Según el material, el RPO determina:","c":"La frecuencia con que se ejecutan los backups.","d":["El tiempo máximo que el sistema puede estar caído.","Cuántas copias fuera del sitio hacen falta.","El tipo de medio de almacenamiento."],"f":[],"cf":false,"e":"El RPO se mide en tiempo: backup cada 4 horas, RPO de 4 horas. El tiempo de caída es el RTO."},{"id":"2153f209da","t":11,"q":"Al conectar un switch a un router Cisco en Packet Tracer, el cable queda en rojo. ¿Por qué?","c":"Porque los puertos del router vienen apagados de fábrica.","d":["Porque se usó un cable cruzado en lugar de uno directo.","Porque las PCs todavía no tienen configurada su dirección IP.","Porque el switch está negociando STP y en unos segundos pasa a verde."],"f":[],"cf":false,"e":"El switch asume confianza (sus puertos están encendidos); el router asume desconfianza."},{"id":"3ebe4a3373","t":11,"q":"¿En qué modo de la CLI se puede modificar la configuración del router?","c":"Configuración global, Router(config)#.","d":["Privilegiado, Router#, al que se entra con enable.","Usuario, Router>.","En cualquiera de los tres."],"f":[],"cf":false,"e":"El privilegiado (enable) permite ver y monitorear, pero no configurar."},{"id":"ed490df384","t":11,"q":"La running-config se guarda en:","c":"RAM.","d":["NVRAM.","ROM.","El servidor TFTP."],"f":[],"cf":false,"e":"La startup-config está en NVRAM. La running-config se pierde al apagar si no se guarda."},{"id":"15b2e8dbcc","t":11,"q":"¿Para qué se usa el comando transport input ssh en las líneas VTY?","c":"Para aceptar solo SSH y rechazar Telnet.","d":["Para cifrar la contraseña del modo privilegiado.","Para generar las claves RSA que usa SSH.","Para habilitar cinco sesiones remotas simultáneas."],"f":[],"cf":false,"e":"enable secret cifra la contraseña, crypto key generate rsa genera las claves y line vty 0 4 habilita las cinco sesiones."},{"id":"57b3238a26","t":11,"q":"El comando line vty 0 4 habilita:","c":"Hasta 5 sesiones remotas simultáneas.","d":["Hasta 4 sesiones remotas simultáneas.","Las interfaces 0 a 4 del router.","Los niveles de privilegio 0 a 4."],"f":[],"cf":false,"e":"Son las líneas 0, 1, 2, 3 y 4."},{"id":"24ba8c70cc","t":11,"q":"En username admin privilege 15 secret cisco123, el valor 15 indica:","c":"El nivel de privilegio máximo, con control total.","d":["El nivel de privilegio mínimo.","La cantidad de intentos de login permitidos.","La longitud mínima de la contraseña."],"f":[],"cf":false,"e":"Los privilegios van de 0 (mínimo) a 15 (superusuario)."},{"id":"a94e508f8c","t":11,"q":"El comando crypto key generate rsa:","c":"Genera un par de claves asimétricas para cifrar las sesiones SSH.","d":["Genera una clave simétrica AES para cifrar el tráfico entre VLANs.","Instala un certificado firmado por una Autoridad Certificadora.","Calcula el hash de la contraseña del modo privilegiado."],"f":[],"cf":false,"e":"En clase se usó una clave de 1024 bits. Une la parte práctica con la criptografía asimétrica."},{"id":"c3b5b7bf24","t":11,"q":"¿Cuál NO es un requisito para habilitar SSH en el router según la clase?","c":"Una ACL extendida que permita el puerto 22.","d":["Definir un dominio con el comando ip domain-name.","Crear un usuario local con username y secret.","Generar las claves RSA."],"f":[],"cf":false,"e":"Los tres requisitos son dominio, usuario local y claves RSA."},{"id":"85fd34ff4c","t":11,"q":"¿Para qué sirve el comando no ip domain-lookup?","c":"Para evitar que el router se congele al escribir mal un comando.","d":["Para desactivar el servicio DNS para las PCs de la red.","Para bloquear ataques de DNS spoofing contra el router y las PCs de la red.","Para impedir que el router publique sus redes por OSPF."],"f":[],"cf":false,"e":"Ahorra tiempo cuando se escribe mal un comando."},{"id":"6d1729899c","t":11,"q":"¿Por qué el enlace entre los routers de Rosario y Córdoba usa la máscara 255.255.255.252?","c":"Porque un /30 deja solo 2 IPs útiles.","d":["Porque un /30 permite hasta 252 equipos en el enlace.","Porque OSPF solo funciona con máscaras /30.","Porque es la máscara que corresponde a la wildcard 0.0.0.255."],"f":[],"cf":false,"e":"Una conexión punto a punto solo necesita dos IPs (.1 y .2)."},{"id":"44fb1bde0b","t":11,"q":"¿Qué hace OSPF en el caso Rosario y Córdoba?","c":"Anuncia las redes de cada router para que el otro las aprenda.","d":["Etiqueta las tramas con el número de VLAN.","Traduce las IPs privadas de las sucursales a IPs públicas.","Cifra el tráfico entre las dos sucursales mediante un túnel entre los routers."],"f":[],"cf":false,"e":"Es enrutamiento dinámico. Etiquetar es 802.1Q, traducir es NAT y cifrar sería una VPN."},{"id":"e563f6a623","t":11,"q":"Aplicar interface range FastEthernet 0/3 - 24 y luego shutdown en un switch sirve para:","c":"Apagar los puertos libres para impedir conexiones no autorizadas.","d":["Asignar los puertos 3 a 24 a la VLAN de usuarios.","Convertir los puertos 3 a 24 en troncales para transportar todas las VLANs.","Reiniciar los puertos para renegociar STP."],"f":[],"cf":false,"e":"Es una medida de seguridad física: el puerto solo vuelve a funcionar si un administrador ejecuta no shutdown."},{"id":"cf8c70d084","t":11,"q":"Según la clase, ¿cuándo se justifica un firewall dedicado (Fortinet, Cisco ASA) en lugar de ACLs en el router?","c":"En redes grandes (bancos) que requieren NAT masivo, IDS/IPS y filtrado en capa 7.","d":["En cualquier pyme, porque las ACL de un router Cisco o MikroTik no brindan ninguna seguridad real.","Solo cuando la red usa VLANs.","Cuando el router no admite ACL extendidas."],"f":[],"cf":false,"e":"Para una pyme alcanzan las ACL en un router Cisco o MikroTik."},{"id":"ff14f5abf1","t":11,"q":"¿Qué herramienta usaría para modelar una red segmentada con VLANs y ACLs antes de implementarla?","c":"Cisco Packet Tracer.","d":["Wireshark.","Nessus Professional.","Nmap."],"f":[],"cf":false,"e":"Wireshark es un sniffer, Nessus escanea vulnerabilidades y Nmap explora redes y puertos."},{"id":"337a28bb20","t":11,"q":"El comando enable secret cisco:","c":"Define una contraseña cifrada para pasar al modo privilegiado.","d":["Habilita SSH con la contraseña cisco.","Crea el usuario cisco con privilegio 15.","Define la contraseña que piden las líneas VTY en las conexiones remotas."],"f":[],"cf":false,"e":"Protege el paso de Router> a Router#."},{"id":"48a918354b","t":12,"q":"Un router que conserva el usuario y la contraseña \"admin\" de fábrica presenta una vulnerabilidad de:","c":"Configuración.","d":["Software.","Red.","Humana (error del usuario)."],"f":[],"cf":false,"e":"Contraseñas por defecto, puertos innecesarios abiertos y permisos excesivos son vulnerabilidades de configuración."},{"id":"992454cf31","t":12,"q":"Una inyección SQL explota una vulnerabilidad de:","c":"Software.","d":["Configuración.","Red.","Física."],"f":[],"cf":false,"e":"Errores o bugs en el código son vulnerabilidades de software."},{"id":"3e97d9c01e","t":12,"q":"Guardar los backups en la misma sala que los servidores es una vulnerabilidad:","c":"Física.","d":["De configuración.","Humana.","De red."],"f":[],"cf":false,"e":"Riesgo de robo, incendio o desastre sobre ambos a la vez."},{"id":"4fd6b52d84","t":12,"q":"La captura de tráfico sin cifrar (sniffing) y los ataques MitM son vulnerabilidades de:","c":"Red.","d":["Software.","Configuración.","Humanas."],"f":[],"cf":false,"e":"Fallos en dispositivos de red o protocolos."},{"id":"c38726452b","t":12,"q":"¿Qué es una amenaza?","c":"Cualquier acción que explota una vulnerabilidad.","d":["La debilidad del software o del hardware que permite un ataque.","La probabilidad de que exista una vulnerabilidad.","El impacto que produce un incidente de seguridad."],"f":[],"cf":false,"e":"La debilidad es la vulnerabilidad; la amenaza es lo que la aprovecha."},{"id":"f8ff5b27da","t":12,"q":"¿Cuál de estas afirmaciones sobre un troyano es FALSA?","c":"Se autorreplica por la red.","d":["Se presenta como software legítimo.","Puede abrir puertas traseras.","Se usa como puerta de entrada para ransomware."],"f":[],"cf":false,"e":"El troyano no se replica: depende de que el usuario lo instale. El que se replica solo es el gusano."},{"id":"8fe1f91c0c","t":12,"q":"¿Qué malware necesita que el usuario ejecute un archivo infectado y se inserta en otros archivos?","c":"Virus.","d":["Gusano.","Troyano.","Cryptojacking."],"f":[],"cf":false,"e":"El gusano es autónomo; el troyano no se replica."},{"id":"75f8588727","t":12,"q":"¿Qué método de identificación de vulnerabilidades opera en tiempo real?","c":"Monitoreo continuo.","d":["Escaneo de vulnerabilidades.","Pentesting.","Revisión de código."],"f":[],"cf":false,"e":"El pentesting simula ataques controlados; el escaneo es automático pero puntual."},{"id":"5c55893061","t":12,"q":"Wireshark es:","c":"Un analizador de protocolos (sniffer).","d":["Un escáner de vulnerabilidades y puertos abiertos.","Una herramienta de fuerza bruta.","Un explorador de redes y puertos."],"f":[],"cf":false,"e":"Nessus escanea vulnerabilidades, Hydra hace fuerza bruta y Nmap explora redes y puertos."},{"id":"9e4e542c74","t":12,"q":"¿Cuál NO es uno de los cuatro tipos básicos de ataques de red del material?","c":"Ataques de transposición.","d":["Denegación de servicio.","Ataques contra la autenticación.","Ataques de modificación y daño a la integridad."],"f":[],"cf":false,"e":"El cuarto tipo es \"aprovechando deficiencias de seguridad\". Transposición es un tipo de cifrado."},{"id":"1a769a2d15","t":12,"q":"Según el material, la medida más importante frente a usuarios sin conocimientos suficientes es:","c":"La concientización.","d":["El antivirus corporativo.","El firewall perimetral.","La segmentación de red."],"f":[],"cf":false,"e":"El usuario es el eslabón más débil; la herramienta técnica no reemplaza la concientización."},{"id":"f59b940fb8","t":12,"q":"¿Cuál de estas medidas NO ayuda a protegerse contra el malware?","c":"Usar una cuenta de administrador para el trabajo diario.","d":["Actualizar el sistema operativo y las aplicaciones.","Suscribirse a boletines de seguridad.","Deshabilitar la autoejecución de dispositivos USB."],"f":[],"cf":false,"e":"Lo recomendado es mínimo privilegio: no trabajar con perfil de administrador."},{"id":"2d29eeb645","t":12,"q":"¿Qué es la ingeniería social?","c":"Técnicas de manipulación para obtener información confidencial de los usuarios.","d":["Una herramienta que escanea IPs y puertos para detectar aplicaciones instaladas.","Un agujero producido por un error de configuración o un fallo de diseño.","Cualquier comportamiento de un empleado que pone en riesgo a la organización."],"f":[],"cf":false,"e":"Usa manipulación, engaño y chantaje. Factores: curiosidad, cortesía, credulidad, codicia, inconsciencia, timidez y apatía."},{"id":"ed2448f3e7","t":13,"q":"El credential stuffing consiste en:","c":"Reutilizar credenciales filtradas de otros servicios.","d":["Probar todas las combinaciones posibles de caracteres.","Probar primero palabras y contraseñas frecuentes.","Instalar un keylogger para capturar lo que escribe el usuario."],"f":[],"cf":false,"e":"Aprovecha que la gente repite contraseñas. Probar todas es fuerza bruta pura y lo frecuente es diccionario."},{"id":"ffd72bbb6a","t":13,"q":"En un ataque de fuerza bruta offline, el límite principal es:","c":"El algoritmo de hash y el hardware del atacante.","d":["El rate limiting y los bloqueos progresivos del servidor.","El CAPTCHA del formulario de login.","El MFA de la cuenta."],"f":[],"cf":false,"e":"Offline se ataca a hashes ya robados, sin tocar el servicio. Rate limiting, CAPTCHA y MFA frenan el ataque online."},{"id":"100fea9fcc","t":13,"q":"¿Cuál afirmación sobre el salt es correcta?","c":"Es aleatorio, único por contraseña, no es secreto y se guarda junto al hash.","d":["Es un secreto único del sistema que se guarda fuera de la base de datos.","Es un valor fijo que se agrega a todas las contraseñas.","Reemplaza la necesidad de usar un algoritmo lento."],"f":[],"cf":false,"e":"La primera distractora describe al pepper. La diferencia está en dónde se guardan."},{"id":"37fc9d9956","t":13,"q":"¿Qué algoritmo es el más adecuado para almacenar contraseñas según la exposición?","c":"Argon2id","d":["SHA-256 con salt","MD5","AES-256"],"f":[],"cf":false,"e":"Argon2id es lento y exige memoria. SHA-256 es rápido (malo contra fuerza bruta offline) y AES es cifrado reversible, no hash."},{"id":"fc574d825c","t":13,"q":"¿Cuántas combinaciones hay para una contraseña de 8 letras minúsculas (26 letras)?","c":"26^8","d":["8^26","26 x 8","10^8"],"f":[],"cf":false,"e":"Cada carácter extra multiplica, no suma: 26^8 = 208.827.064.576."},{"id":"abdf0fea1e","t":13,"q":"¿Qué diferencia a un pentester de un atacante que usa la misma técnica de fuerza bruta?","c":"La autorización explícita y por escrito.","d":["Las herramientas que utiliza.","Que el pentester solo ataca de forma offline.","Que el pentester no puede usar diccionarios."],"f":[],"cf":false,"e":"Técnica igual; la única frontera es la autorización."},{"id":"a0824bb367","t":13,"q":"¿Por qué el hashing no es cifrado?","c":"Porque no es reversible.","d":["Porque produce salidas de longitud variable.","Porque usa la misma clave para ambas operaciones.","Porque solo se aplica a contraseñas."],"f":[],"cf":false,"e":"El cifrado se revierte con la clave; el hash es unidireccional."},{"id":"fefaeeb1a3","t":13,"q":"¿Qué propiedad del hash hace que un cambio mínimo en la entrada genere un resultado radicalmente distinto?","c":"Efecto avalancha.","d":["Determinismo.","Resistencia a colisiones.","Unidireccionalidad."],"f":[],"cf":false,"e":"Determinista: misma entrada, misma salida. Unidireccional: no se revierte. Resistencia a colisiones: es improbable que dos entradas den el mismo hash."},{"id":"d141b9d0cd","t":13,"q":"La fuerza bruta funciona cuando falla alguna de tres cosas. ¿Cuál NO es una de ellas?","c":"El cifrado del canal de comunicación.","d":["Un espacio de búsqueda chico.","Contraseñas predecibles o reutilizadas.","Un sistema sin límite de intentos."],"f":[],"cf":false,"e":"El cifrado del canal no frena probar credenciales contra el login."},{"id":"d0e11f4d11","t":13,"q":"¿Qué medida previene la fuerza bruta offline?","c":"Salt único y Argon2id en lugar de SHA-256.","d":["Rate limiting en el formulario de login.","CAPTCHA después de tres intentos.","Bloqueos progresivos de la cuenta."],"f":[],"cf":false,"e":"Offline el atacante ya tiene los hashes: solo sirve que cada prueba sea cara. Rate limiting, CAPTCHA y bloqueos frenan el ataque online."},{"id":"6e3f6ea7a6","t":13,"q":"¿Qué recomienda la exposición del lado del usuario?","c":"Contraseña única por sitio, MFA y passkey si existe.","d":["Usar la misma contraseña robusta en todos los sitios.","Cambiar la contraseña todos los días para que no alcancen a probarla.","Guardar las contraseñas en un archivo de texto dentro del escritorio."],"f":[],"cf":false,"e":"Una contraseña repetida habilita el credential stuffing."},{"id":"ba933c4a31","t":14,"q":"Un ransomware destruye los datos y no existe una clave real para recuperarlos. Es de tipo:","c":"Wiper.","d":["Locker.","Crypto.","Doxware."],"f":[],"cf":false,"e":"Wiper es un falso ransomware (NotPetya, HermeticWiper): pagar no sirve."},{"id":"4263e6825a","t":14,"q":"La víctima puede usar su equipo con normalidad, pero sus archivos están cifrados. Es un ransomware:","c":"Crypto.","d":["Locker.","Wiper.","RaaS."],"f":[],"cf":false,"e":"El locker bloquea el acceso al sistema completo. RaaS es un modelo de negocio, no un tipo técnico."},{"id":"523da07fbb","t":14,"q":"La triple extorsión agrega, respecto de la doble:","c":"Un ataque DDoS contra la víctima.","d":["La amenaza de publicar los datos robados.","El contacto directo con clientes, socios y prensa.","El cifrado de los backups."],"f":[],"cf":false,"e":"Doble = publicar datos; triple = DDoS; cuádruple = contactar clientes, socios y prensa."},{"id":"edd646fa1e","t":14,"q":"En el modelo RaaS, el reparto típico de ganancias es:","c":"70% para el afiliado y 30% para el operador.","d":["30% para el afiliado y 70% para el operador.","50% para cada uno.","90% para el operador y 10% para el afiliado."],"f":[],"cf":false,"e":"El afiliado hace el ataque y se lleva la mayor parte."},{"id":"1d54f145ed","t":14,"q":"¿Cuál fue el acceso inicial en el caso Colonial Pipeline (2021)?","c":"Una cuenta VPN legacy sin MFA.","d":["Un portal Citrix sin MFA.","Un correo de phishing con macros.","La vulnerabilidad EternalBlue en SMBv1."],"f":[],"cf":false,"e":"Citrix sin MFA fue Change Healthcare (2024) y EternalBlue fue WannaCry (2017)."},{"id":"e38a89beb6","t":14,"q":"En el caso de la Dirección Nacional de Migraciones (Argentina, 2020):","c":"El ransomware fue Netwalker; Argentina no pagó y restauró desde backups.","d":["El ransomware fue LockBit y el Estado pagó USD 4 millones.","El ransomware fue WannaCry y se frenó con el kill switch.","El ransomware fue Netwalker y se pagó el rescate para evitar la filtración."],"f":[],"cf":false,"e":"Pidieron USD 4 millones y no se pagó."},{"id":"225833ac65","t":14,"q":"WannaCry (2017) se propagó:","c":"Como gusano, explotando SMBv1 con EternalBlue.","d":["Por correos de phishing con documentos Word con macros.","Por escritorios remotos (RDP) expuestos.","Por pendrives con accesos directos maliciosos."],"f":[],"cf":false,"e":"Las macros son Emotet y los accesos directos por USB son Bondat."},{"id":"5182beb54c","t":14,"q":"¿Cuál es el orden de las fases de respuesta a incidentes según NIST 800-61?","c":"Preparación, detección y análisis, contención, erradicación, recuperación, lecciones aprendidas.","d":["Detección, preparación, erradicación, contención, recuperación, lecciones aprendidas.","Preparación, contención, detección y análisis, recuperación, erradicación, lecciones aprendidas.","Detección y análisis, contención, recuperación, erradicación, preparación, lecciones aprendidas."],"f":[],"cf":false,"e":"Primero se contiene y después se erradica; recién al final se recupera."},{"id":"c10bab8747","t":14,"q":"¿Qué recomiendan CISA, FBI y ENISA ante un ataque de ransomware?","c":"No pagar: reportar, contener y restaurar desde un backup verificado.","d":["Pagar dentro de las 72 horas para evitar que el precio se duplique y se filtren los datos.","Pagar solo si el ransomware es de tipo wiper.","Negociar siempre a través del Initial Access Broker."],"f":[],"cf":false,"e":"El 78% de quienes pagan vuelven a ser atacados."},{"id":"0df3e87fca","t":14,"q":"En la cadena de ataque de un ransomware, ¿qué ocurre al final?","c":"El cifrado y la nota de rescate.","d":["La exfiltración de datos hacia la nube del atacante.","El movimiento lateral.","El acceso inicial."],"f":[],"cf":false,"e":"El cifrado es lo último que ocurre, después de días de acceso y exfiltración."},{"id":"6dee893b34","t":14,"q":"Rclone y MegaSync aparecen en la cadena de ataque del ransomware en la fase de:","c":"Exfiltración.","d":["Movimiento lateral.","Acceso inicial.","Persistencia y escalada."],"f":[],"cf":false,"e":"Los datos se envían a la nube del atacante antes de cifrar."},{"id":"e2b188a4e1","t":14,"q":"SMB, PsExec y RDP interno se usan en la fase de:","c":"Movimiento lateral.","d":["Reconocimiento.","Exfiltración.","Ejecución."],"f":[],"cf":false,"e":"El reconocimiento usa OSINT y escaneo; la ejecución usa loaders, macros y LOLBins."},{"id":"83e2c8e138","t":14,"q":"En el modelo RaaS, el rol que vende accesos ya obtenidos (RDP, VPN o credenciales) es el:","c":"Initial Access Broker.","d":["Afiliado del programa RaaS.","Negociador.","Operador."],"f":[],"cf":false,"e":"El afiliado compromete a la víctima y despliega el ransomware; el operador mantiene el código, el panel y el sitio de leak."},{"id":"b45ba85e9e","t":14,"q":"Según Sophos 2025, ¿cuál es el principal vector de acceso inicial del ransomware?","c":"Vulnerabilidades explotadas (32%).","d":["Credenciales comprometidas (23%).","Correo malicioso (19%).","Phishing (18%)."],"f":[],"cf":false,"e":"Además, el 55% de los ataques usa un problema técnico corregible, como la falta de parche o de MFA."},{"id":"0b7ed8b6d1","t":14,"q":"¿Quién detuvo la ola inicial de WannaCry y cómo?","c":"Marcus Hutchins, registrando el dominio kill switch del malware.","d":["Microsoft, desactivando SMBv1 en forma remota en todos los equipos.","El FBI, tomando el panel y el sitio de leaks de los afiliados.","La NCA británica, con la Operation Cronos."],"f":[],"cf":false,"e":"El dominio estaba hardcodeado en el malware. La Operation Cronos fue contra LockBit en 2024."},{"id":"509545ffc3","t":14,"q":"La Operation Cronos (febrero de 2024) fue una operación internacional contra:","c":"LockBit.","d":["Netwalker.","DarkSide.","ALPHV/BlackCat."],"f":[],"cf":false,"e":"Coordinada por 10 países: tomaron el panel, el sitio de leaks, el código fuente y datos de 194 afiliados."},{"id":"24da3a423b","t":14,"q":"En el caso Colonial Pipeline, la operación se detuvo 6 días. ¿Por qué?","c":"Por precaución.","d":["Porque el ransomware cifró los controladores del oleoducto.","Porque el FBI ordenó cerrar hasta recuperar el rescate.","Porque se negaron a pagar y no tenían backups."],"f":[],"cf":false,"e":"No fue por cifrado del sistema operativo. Pagaron USD 4,4 millones y el FBI recuperó USD 2,3 millones."},{"id":"56439d6887","t":14,"q":"La nota de rescate suele incluir un ID único. ¿Para qué sirve?","c":"Para correlacionar a la víctima con su clave privada.","d":["Para identificar al afiliado ante la policía.","Para validar el pago en la cadena de Bitcoin sin intermediarios.","Para desbloquear el equipo sin pagar."],"f":[],"cf":false,"e":"La nota también trae precio, plazo, canal de contacto vía TOR y amenaza de publicar los datos."},{"id":"cab847aa25","t":14,"q":"Según la exposición, ¿qué porcentaje de quienes pagan el rescate vuelve a ser atacado?","c":"78%","d":["49%","97%","32%"],"f":[],"cf":false,"e":"49% es la proporción de víctimas que pagó en 2025 y 97% la que recuperó los datos cifrados."},{"id":"66f088f9dc","t":14,"q":"¿Cuál de estas NO es una razón en contra de pagar el rescate según la exposición?","c":"Que reconstruir siempre cuesta menos que pagar.","d":["Que financia al crimen organizado.","Que no garantiza una clave funcional.","Que puede violar sanciones internacionales (OFAC)."],"f":[],"cf":false,"e":"La exposición dice lo contrario: un argumento a favor del pago es su menor costo directo frente a la reconstrucción."},{"id":"28212d9887","t":14,"q":"En NIST 800-61, \"aislar segmentos, cortar el C&C y revocar sesiones\" corresponde a:","c":"Contención.","d":["Erradicación.","Recuperación.","Detección y análisis."],"f":[],"cf":false,"e":"Erradicación: remover persistencia y rotar credenciales. Recuperación: restaurar desde un backup validado."},{"id":"1e1fcf6184","t":14,"q":"¿Qué incluye la fase de preparación de NIST 800-61?","c":"El plan de respuesta, roles, contactos y un retainer forense.","d":["Restaurar los sistemas desde un backup validado y verificado.","Revocar sesiones, aislar segmentos y cortar el comando y control.","Un postmortem sin buscar culpables."],"f":[],"cf":false,"e":"Las distractoras son recuperación, contención y lecciones aprendidas."},{"id":"d257ce3e5e","t":15,"q":"En un ataque, la víctima escribe correctamente la URL de su banco pero termina en el servidor del atacante, sin haber hecho clic en ningún enlace. Es:","c":"Pharming.","d":["Spear phishing.","Angler phishing.","Quishing."],"f":[],"cf":false,"e":"El pharming manipula el DNS."},{"id":"1e64046d7e","t":15,"q":"Un correo suplanta al CEO y le ordena al gerente financiero una transferencia urgente. Es:","c":"Whaling.","d":["Smishing.","Vishing.","Email phishing masivo."],"f":[],"cf":false,"e":"Whaling (fraude del CEO) apunta a altos ejecutivos o suplanta al CEO. Es el de mayor nivel de personalización."},{"id":"0b6e46954c","t":15,"q":"Un código QR pegado en la vía pública redirige a un sitio falso y evade los filtros de texto del correo. Es:","c":"Quishing.","d":["Smishing.","Pharming.","Angler phishing."],"f":[],"cf":false,"e":"QR phishing = quishing."},{"id":"7704a8cf38","t":15,"q":"Una cuenta falsa de atención al cliente responde a los reclamos públicos que los usuarios hacen en redes sociales. Es:","c":"Angler phishing.","d":["Social media phishing.","Whaling.","Spear phishing."],"f":[],"cf":false,"e":"El social media phishing usa perfiles falsos o promociones engañosas; el angler responde a reclamos reales."},{"id":"eb92309e63","t":15,"q":"Según la regla de efectividad del phishing:","c":"Más personalización, más éxito, pero más costo para el atacante.","d":["A mayor volumen de correos, mayor tasa de éxito y menor costo.","La personalización reduce la tasa de éxito porque la víctima sospecha.","La tasa de éxito no depende de la personalización sino del canal."],"f":[],"cf":false,"e":"Por eso el spear phishing y el whaling son más efectivos que el masivo."},{"id":"32ae91bc51","t":15,"q":"El término phishing surge de combinar:","c":"Fishing y phreaking.","d":["Fishing y hacking.","Fishing y phone hacking.","Fishing y spoofing."],"f":[],"cf":false,"e":"Phreaking era el hackeo de sistemas telefónicos."},{"id":"3c462a6e0c","t":15,"q":"Una llamada de un falso soporte técnico que pide credenciales es:","c":"Vishing.","d":["Smishing.","Spear phishing.","Pharming."],"f":[],"cf":false,"e":"Vishing = voz; smishing = SMS o WhatsApp."},{"id":"29aa71f098","t":16,"q":"¿Cuál es el orden del mecanismo de propagación de un gusano?","c":"Escaneo, explotación, auto-replicación, repetición.","d":["Explotación, escaneo, repetición, auto-replicación.","Auto-replicación, escaneo, explotación, repetición.","Escaneo, auto-replicación, explotación, repetición."],"f":[],"cf":false,"e":"Primero busca víctimas, entra, se copia y el nuevo equipo pasa a atacar."},{"id":"f0ed7567cc","t":16,"q":"El gusano Bondat se propagaba:","c":"Por USB, con accesos directos maliciosos.","d":["Por paquetes falsos de npm y repositorios de GitHub.","Explotando SMBv1 en redes corporativas.","Por correos con documentos Word con macros."],"f":[],"cf":false,"e":"Su objetivo era la minería de criptomonedas. npm y GitHub son de PolinRider."},{"id":"757bae380f","t":16,"q":"Emotet surgió como:","c":"Troyano bancario que se volvió plataforma de distribución de malware.","d":["Gusano que explotaba SMBv1 y se propagaba solo por redes corporativas.","Ransomware de tipo locker.","Zero-day en PLC Siemens."],"f":[],"cf":false,"e":"Se propagaba por phishing con documentos Word con macros y distribuyó TrickBot y Ryuk."},{"id":"5ab89cde57","t":16,"q":"¿Cómo se frena un gusano como PolinRider según la exposición?","c":"Exigiendo revisión de otro desarrollador antes de integrar cambios a la rama principal.","d":["Deshabilitando la autoejecución de USB en todas las computadoras de los desarrolladores.","Pagando el rescate que exige la campaña.","Instalando un antivirus en los servidores de GitHub."],"f":[],"cf":false,"e":"También: escanear con GitHub Actions y rotar credenciales. Deshabilitar la autoejecución de USB es la defensa frente a Bondat."},{"id":"9c04f86018","t":16,"q":"¿Qué tipo de troyano descarga e instala otro malware?","c":"Downloader/Dropper.","d":["RAT.","Backdoor.","Infostealer."],"f":[],"cf":false,"e":"El RAT da control total y remoto; el backdoor abre un acceso oculto; el infostealer captura pantallas, teclas y datos."},{"id":"27d9606056","t":16,"q":"Un troyano que le da al atacante control total y remoto del equipo es un:","c":"RAT.","d":["Dropper.","Infostealer.","Troyano bancario."],"f":[],"cf":false,"e":"Según la exposición, el RAT da control total y remoto del equipo."},{"id":"524bf466fb","t":16,"q":"El término troyano aplicado a la informática se popularizó en 1983 gracias a:","c":"Ken Thompson.","d":["Marcus Hutchins.","Alan Turing.","Rivest, Shamir y Adleman."],"f":[],"cf":false,"e":"Lo mencionó en su discurso \"Reflections on Trusting Trust\". El término se había aplicado a la informática en 1974."},{"id":"2b84326668","t":17,"q":"¿Cuál afirmación sobre las botnets es correcta según la exposición?","c":"La botnet es la red de equipos comprometidos, no el malware en sí.","d":["Las botnets siempre son maliciosas, porque se crean infectando equipos con malware.","Botnet y malware son sinónimos.","La botnet es el programa que infecta cada dispositivo."],"f":[],"cf":false,"e":"El malware infecta el dispositivo; la botnet es la red de dispositivos bajo control del atacante. La exposición aclara que las botnets no son siempre malas."},{"id":"2289af30c0","t":17,"q":"En una botnet, el bot-herder es:","c":"El controlador que opera los dispositivos con comandos remotos.","d":["Cada uno de los dispositivos infectados (zombis) que ejecutan las órdenes recibidas.","El servidor DNS que usa la botnet para ocultarse.","El antivirus que detecta la infección."],"f":[],"cf":false,"e":"Los bots o zombis son los dispositivos controlados que ejecutan mecánicamente lo que programa el controlador."},{"id":"98662262a2","t":17,"q":"¿Cuál es el modelo de comando y control más implementado hoy según la exposición?","c":"Descentralizado (P2P).","d":["Centralizado (servidor-cliente).","En estrella, con un único botmaster.","Ninguno: las botnets actúan sin comando y control."],"f":[],"cf":false,"e":"En P2P cada nodo es cliente y servidor de comandos a la vez: no hay un único servidor que apagar."},{"id":"92961abcaf","t":17,"q":"En el modelo centralizado de una botnet, la principal desventaja para el atacante es:","c":"El alto riesgo de que descubran y neutralicen el servidor central.","d":["Que no puede coordinar ataques DDoS porque los zombis no se comunican entre sí.","Que cada zombi debe actuar como cliente y servidor.","Que solo funciona con dispositivos IoT."],"f":[],"cf":false,"e":"Es una topología en estrella: todos los zombis reportan a un punto único."},{"id":"67b4871733","t":17,"q":"¿Cuál es el orden de las etapas de creación de una botnet?","c":"Preparación y exposición, infección, activación.","d":["Infección, preparación y exposición, activación.","Activación, infección, preparación y exposición.","Escaneo, explotación, auto-replicación, repetición."],"f":[],"cf":false,"e":"La última distractora es el mecanismo de propagación de un gusano."},{"id":"89e73263bc","t":17,"q":"Para deshabilitar una botnet con la estrategia local, se debe:","c":"Reinstalar el sistema operativo o restablecer de fábrica el dispositivo.","d":["Identificar y desactivar los servidores de comando y control.","Aplicar filtrado de entrada y de salida en el firewall perimetral de la red.","Pagarle al bot-herder para que libere los equipos."],"f":[],"cf":false,"e":"Desactivar los servidores C&C es la estrategia centralizada. El filtrado es una estrategia de mitigación."},{"id":"fcd8b239fb","t":17,"q":"¿Qué estrategia de mitigación de botnets detiene el flujo de datos maliciosos hacia el exterior?","c":"Filtrado de salida.","d":["Filtrado de entrada.","Ejecución de terceros restringida.","Estrategia local de deshabilitación."],"f":[],"cf":false,"e":"El filtrado de entrada bloquea lo que intenta ingresar; la ejecución restringida aísla código no firmado con políticas de kernel."},{"id":"04e25927e0","t":17,"q":"La botnet Methbot se caracterizó por:","c":"Usar los equipos como visores de anuncios.","d":["Convertir PCs infectadas en proxies para ocultar tráfico ajeno.","Representar el 25% del spam mundial.","Robar datos bancarios interceptando el tecleo del usuario."],"f":[],"cf":false,"e":"Generaba ingresos con publicidad. Los proxies son 911 S5, el 25% del spam es EarthLink Spammer y el tecleo es Zeus."},{"id":"3c167cf189","t":17,"q":"¿Qué botnet llegó a representar el 25% del spam mundial?","c":"EarthLink Spammer.","d":["Phorpiex.","Methbot.","911 S5."],"f":[],"cf":false,"e":"Phorpiex también enviaba spam masivo, pero el dato del 25% corresponde a EarthLink Spammer, uno de los primeros ataques de botnet."},{"id":"cc8f39d953","t":17,"q":"Phorpiex, además de enviar spam masivo, incorporó:","c":"Crypto-clipping.","d":["El ransomware Ryuk.","Minería con Monero desde navegadores.","Ataques DDoS de 31,4 Tbps."],"f":[],"cf":false,"e":"Sus servidores se desactivaron en 2021."},{"id":"63e8bf0a59","t":17,"q":"Entre los ataques que se hacen con botnets, el material asocia el \"spyware\" a:","c":"Fraude automatizado de clics en publicidad.","d":["Sobrecarga masiva de servidores.","Marcación forzada a números telefónicos premium.","Relleno de credenciales."],"f":[],"cf":false,"e":"La sobrecarga es DDoS, la marcación forzada es acceso telefónico (en desuso) y el relleno de credenciales es fuerza bruta."},{"id":"e34d93e560","t":17,"q":"Según la exposición, ¿qué dispositivos son blanco potencial de una botnet?","c":"Todo dispositivo con una computadora interna, incluidos los IoT.","d":["Solo servidores con puertos expuestos directamente a Internet sin firewall.","Solo PCs con Windows.","Solo routers sin actualizar."],"f":[],"cf":false,"e":"Desde PCs y routers hasta cámaras y otros dispositivos IoT."},{"id":"0e8910a2b7","t":18,"q":"Un zero-day es:","c":"Un fallo que el fabricante aún no conoce, sin parche.","d":["Una vulnerabilidad conocida que la empresa no parcheó a tiempo.","Un ataque que se ejecuta el mismo día en que se publica el parche.","Un malware que se borra solo a las 0 horas."],"f":[],"cf":false,"e":"La trampa es la primera distractora: si el fabricante ya la conoce, no es zero-day."},{"id":"ee32912fe0","t":18,"q":"Las tres etapas de un zero-day, en orden, son:","c":"Vulnerabilidad, exploit, ataque.","d":["Exploit, vulnerabilidad, ataque.","Ataque, exploit, parche.","Vulnerabilidad, parche, exploit."],"f":[],"cf":false,"e":"El exploit es el código que aprovecha la vulnerabilidad; el ataque es su uso contra un objetivo real."},{"id":"e7033851be","t":18,"q":"¿Cómo llegó Stuxnet a la red de Natanz, que estaba aislada (air-gapped)?","c":"Por USB.","d":["Por una VPN sin MFA.","Por un correo de phishing.","Por un servidor web de la DMZ."],"f":[],"cf":false,"e":"Usó 4 zero-days de Windows y 1 del PLC Siemens."},{"id":"51793cb67f","t":18,"q":"¿Por qué los antivirus basados en firmas son ineficaces contra un zero-day?","c":"Porque todavía no existe una firma del ataque.","d":["Porque el zero-day cifra el disco antes de ejecutarse.","Porque solo analizan tráfico de red y no archivos.","Porque los zero-day solo atacan sistemas Linux."],"f":[],"cf":false,"e":"La mitigación pasa por EDR/XDR, Zero Trust, sandboxing y mínimo privilegio."},{"id":"819de40b51","t":18,"q":"La ventana de exposición de un zero-day es el período:","c":"Entre la explotación activa y la disponibilidad del parche.","d":["Entre el descubrimiento del fallo por el fabricante y su divulgación pública.","Entre la creación del exploit y su venta en el mercado negro.","Entre la instalación del parche y el siguiente reinicio."],"f":[],"cf":false,"e":"Es el período de mayor riesgo para cualquier organización."},{"id":"ccc13a0f35","t":18,"q":"¿Qué medida de mitigación de zero-days fomenta la divulgación responsable de fallos?","c":"Bug bounty.","d":["Sandboxing.","Zero Trust.","EDR/XDR."],"f":[],"cf":false,"e":"Sandboxing aísla archivos sospechosos; Zero Trust segmenta y limita el acceso; EDR/XDR detecta comportamiento anómalo."},{"id":"4ba453b426","t":18,"q":"Según la exposición, Stuxnet retrasó el programa nuclear iraní aproximadamente:","c":"2 años.","d":["6 meses.","10 años.","Nada: lo detectaron antes de actuar."],"f":[],"cf":false,"e":"Inutilizó unas 2.000 centrifugadoras en Natanz."},{"id":"1028ac1050","t":18,"q":"¿Qué caso de zero-day infectaba dispositivos con cero clics?","c":"Pegasus.","d":["Log4Shell.","EternalBlue.","Stuxnet."],"f":[],"cf":false,"e":"Log4Shell (2021) expuso millones de servidores; EternalBlue fue la base de WannaCry."},{"id":"424e8c00d7","t":19,"q":"¿Cuál de estas afirmaciones sobre DoS y DDoS es correcta?","c":"Ninguno de los dos busca robar datos: atacan la disponibilidad.","d":["El DDoS usa un único equipo con mucho ancho de banda para saturar al objetivo.","El DoS es más difícil de rastrear que el DDoS.","El DDoS busca robar información aprovechando la saturación."],"f":[],"cf":false,"e":"DoS = un origen, rastreo más simple; DDoS = botnet, rastreo muy difícil."},{"id":"f6d0cf82f2","t":19,"q":"¿Cuál de estos ataques está bien clasificado según la capa?","c":"Slowloris, de aplicación.","d":["SYN flood, de aplicación.","HTTP flood, de protocolo.","Smurf, volumétrico."],"f":[],"cf":false,"e":"Volumétrico: UDP flood, amplificación DNS. Protocolo: SYN flood, Smurf. Aplicación: HTTP flood, Slowloris."},{"id":"9bccb02bb3","t":19,"q":"En el ataque a Dyn con la botnet Mirai (2016), Amazon resistió porque:","c":"Tenía un segundo proveedor de DNS.","d":["Usaba un IPS en todos sus servidores.","Había bloqueado el tráfico de dispositivos IoT.","Tenía sus servidores en una DMZ."],"f":[],"cf":false,"e":"Mirai usó unos 100.000 dispositivos IoT con credenciales de fábrica contra el DNS de Dyn."},{"id":"be1a03931a","t":19,"q":"El ataque a Spamhaus (2013) logró 300 Gbps sin una botnet propia gracias a:","c":"La reflexión y amplificación DNS usando resolvers abiertos.","d":["Una red de Smart TVs infectadas.","Un ataque Slowloris sostenido que mantenía abiertas miles de conexiones.","Un zero-day en los servidores de Spamhaus."],"f":[],"cf":false,"e":"La defensa pendiente es BCP 38 (anti-spoofing). Las Smart TVs son el caso Aisuru."},{"id":"6b8855041d","t":19,"q":"En el ataque a Dyn (2016), Spotify seguía funcionando pero nadie podía entrar. ¿Por qué?","c":"Cayó el proveedor de DNS y no se podían resolver sus nombres.","d":["Mirai cifró los servidores de Spotify.","Mirai borró los registros A de Spotify.","La botnet saturó directamente los servidores web de Spotify con tráfico HTTP."],"f":[],"cf":false,"e":"Mirai atacó al DNS de Dyn. Lección: delegar el dominio en varios proveedores y cambiar las contraseñas de fábrica."},{"id":"c01e5b5363","t":19,"q":"La botnet Aisuru (fines de 2025) atacaba en ráfagas de 35 segundos para:","c":"Evadir la mitigación manual.","d":["No agotar las baterías de los dispositivos.","Minar criptomonedas entre ráfaga y ráfaga.","Quedar por debajo del límite de BCP 38."],"f":[],"cf":false,"e":"Alcanzó 31,4 Tbps con millones de dispositivos IoT, incluidas Smart TVs, y se contuvo con filtrado perimetral basado en machine learning."},{"id":"fa4f9e3ca7","t":19,"q":"¿Cuál es la lección del caso Spamhaus según la exposición?","c":"Falta aplicar el filtrado anti-spoofing BCP 38.","d":["Hay que delegar el DNS en varios proveedores.","Hay que usar filtrado perimetral con machine learning.","Hay que cambiar las contraseñas de fábrica de las cámaras."],"f":[],"cf":false,"e":"Las otras son las lecciones de Dyn y de Aisuru."},{"id":"10e9567b41","t":19,"q":"¿Qué tienen en común los ataques a Dyn, Aisuru y Spamhaus según la exposición?","c":"El arma fue equipamiento de terceros mal configurado.","d":["Todos usaron zero-days de Windows para infectar los equipos.","Todos fueron ataques de capa de aplicación.","Todos buscaban robar datos personales."],"f":[],"cf":false,"e":"Resolvers DNS, cámaras y televisores de gente que no sabe que participa. El volumen creció cien veces en doce años."},{"id":"d1f264b21a","t":19,"q":"Un ataque que combina UDP flood, SYN flood y HTTP flood al mismo tiempo es un ataque:","c":"Multivector.","d":["Volumétrico puro.","De reflexión.","Zero-day."],"f":[],"cf":false,"e":"Combinar vectores de distintas capas en un mismo ataque es habitual."},{"id":"8f34e371d2","t":19,"q":"En la exposición de DDoS, Killnet es:","c":"Un grupo de unos 10.000 hackers con el que cuenta Rusia.","d":["El sistema ruso que Ucrania dejó fuera de servicio con un ataque DDoS.","La botnet IoT que atacó a Dyn.","Un filtro anti-spoofing."],"f":[],"cf":false,"e":"Ataca servicios de Ucrania y de la OTAN. El sistema que Ucrania tiró es Chestny Znak."},{"id":"c9a3fe2226","t":20,"q":"El cryptojacking se caracteriza por:","c":"Minar criptomonedas con CPU o GPU ajenas sin ser detectado.","d":["Cifrar los archivos y pedir un rescate en criptomonedas.","Robar las billeteras de criptomonedas de la víctima.","Saturar un servicio con tráfico para dejarlo fuera de línea."],"f":[],"cf":false,"e":"No busca bloquear ni destruir información. La moneda más usada es Monero."},{"id":"b5a9827e21","t":20,"q":"¿Por qué el cryptojacking suele usar Monero?","c":"Se mina bien con CPU común y es privada.","d":["Es la criptomoneda de mayor valor de mercado.","Solo se puede minar con GPU dedicadas.","Sus transacciones son públicas y fáciles de vender."],"f":[],"cf":false,"e":"Su algoritmo RandomX está orientado a CPUs convencionales y su privacidad dificulta el seguimiento."},{"id":"5616dcc7d4","t":20,"q":"¿Qué caso de cryptojacking se dio en la red Wi-Fi de una sucursal de Buenos Aires?","c":"Starbucks (2017).","d":["Coinhive.","Loapi.","Tesla."],"f":[],"cf":false,"e":"Los dispositivos conectados al Wi-Fi se usaban para minar."},{"id":"9be8818f59","t":20,"q":"El cryptojacking contra Tesla (2018) fue posible por:","c":"Una consola de Kubernetes expuesta que dio acceso a recursos en la nube.","d":["Scripts de minería insertados en sitios web comprometidos que visitaban sus empleados.","Un troyano distribuido como app de Android.","Un USB infectado conectado a los servidores."],"f":[],"cf":false,"e":"El troyano de Android es Loapi y los scripts en sitios web son el modelo de Coinhive."},{"id":"c8d4382259","t":20,"q":"Loapi, un troyano de Android usado para cryptojacking, podía causar:","c":"Sobrecalentamiento y daño físico del teléfono.","d":["El cifrado de las fotos y los contactos del usuario.","La caída del DNS de la operadora.","El robo de la billetera de Bitcoin."],"f":[],"cf":false,"e":"Se distribuía como app legítima y usaba intensamente los recursos."},{"id":"5dadec4e3d","t":20,"q":"¿Qué característica del cryptojacking describe que \"el atacante gana y la víctima paga los costos\"?","c":"Asimetría de costos.","d":["Discreción.","Escalabilidad.","Monetización."],"f":[],"cf":false,"e":"Discreción: pasa desapercibido. Escalabilidad: de un equipo a la nube. Monetización: convierte procesamiento en ingresos."},{"id":"e385bb3e80","t":21,"q":"En Argentina, la ley que tipifica los delitos informáticos (como el acceso no autorizado o un DoS) es la:","c":"Ley 26.388.","d":["Ley 25.326.","Ley 27.078.","El Convenio de Budapest."],"f":[],"cf":false,"e":"La 25.326 es de protección de datos personales. Budapest es un convenio internacional."},{"id":"4e200b5d6a","t":21,"q":"La Ley 25.326 obliga a quienes administran bases de datos personales a:","c":"Adoptar medidas de seguridad técnicas.","d":["Denunciar todo ataque de fuerza bruta ante la justicia penal.","Cifrar con RSA todos los datos personales.","Contratar un pentest anual autorizado por escrito."],"f":[],"cf":false,"e":"Es la ley de protección de datos personales."},{"id":"e3bf1dbea0","t":21,"q":"El Convenio de Budapest:","c":"Un marco de cooperación internacional contra ciberdelitos.","d":["Es la ley argentina de protección de datos personales.","Es un estándar técnico de cifrado para VPNs.","Obliga a pagar los rescates de ransomware para recuperar datos públicos."],"f":[],"cf":false,"e":"Es de 2001; la adhesión argentina fue en 2018."},{"id":"6cd9ad6f56","t":21,"q":"Según la Práctica, al descubrir una vulnerabilidad en el trabajo lo correcto es:","c":"Comunicarla por escrito a los responsables, sin ocultarla.","d":["Corregirla en silencio para no generar alarma.","Explotarla para demostrar su gravedad.","Publicarla para que el fabricante la parchee rápido."],"f":[],"cf":false,"e":"Además se recomienda un relevamiento inicial formal al ingresar al puesto y adaptar el lenguaje al interlocutor."}]}</script>
<script>
(function () {
  'use strict';
  document.documentElement.lang = 'es';

  var DATA = JSON.parse(document.getElementById('bank-data').textContent);
  var TOPICS = DATA.topics, BANK = DATA.bank;
  var BY_ID = new Map(BANK.map(function (q) { return [q.id, q]; }));
  var EXAM_N = 20, PASS = 6, LETTERS = 'abcdef', LS_KEY = 'seg-parcial1.v1';
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function inline(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
  function rich(s) {
    var out = [], code = [];
    function flush() { if (code.length) { out.push('<pre class="code">' + code.join('\n') + '</pre>'); code = []; } }
    String(s).split('\n').forEach(function (line) {
      var t = line.trim();
      if (/^`[^`]+`$/.test(t)) { code.push(esc(t.slice(1, -1))); }
      else if (t) { flush(); out.push('<p>' + inline(line) + '</p>'); }
    });
    flush();
    return out.join('');
  }
  function fmt(n) { return (Math.round(n * 10) / 10).toLocaleString('es-AR', { maximumFractionDigits: 1 }); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---------- Progreso guardado (solo en este navegador) ---------- */
  var store = { stats: {}, sel: null };
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        if (parsed.stats && typeof parsed.stats === 'object') store.stats = parsed.stats;
        if (Array.isArray(parsed.sel)) store.sel = parsed.sel;
      }
    }
  } catch (e) { /* sin almacenamiento: la página funciona igual */ }
  function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) { } }
  function record(id, ok) {
    var s = store.stats[id] || { a: 0, w: 0, last: null };
    s.a += 1; if (!ok) s.w += 1; s.last = ok ? 1 : 0;
    store.stats[id] = s; persist();
  }
  function errIds() { return BANK.filter(function (q) { var s = store.stats[q.id]; return s && s.last === 0; }).map(function (q) { return q.id; }); }
  function topicStats(ti) {
    var ok = 0, bad = 0, n = 0;
    BANK.forEach(function (q) {
      if (q.t !== ti) return;
      n++;
      var s = store.stats[q.id];
      if (s && s.last === 1) ok++; else if (s && s.last === 0) bad++;
    });
    return { ok: ok, bad: bad, n: n };
  }

  /* ---------- Sesión ---------- */
  function validSel(sel) { return Array.isArray(sel) ? sel.filter(function (i) { return Number.isInteger(i) && i >= 0 && i < TOPICS.length; }) : []; }
  function pool(sel) { var set = new Set(sel); return BANK.filter(function (q) { return set.has(q.t); }).map(function (q) { return q.id; }); }
  function inst(id) {
    var q = BY_ID.get(id);
    var base = q.cf ? q.d.slice() : [q.c].concat(q.d);
    var opts = shuffle(base).concat(q.f);
    return { id: id, opts: opts, ok: opts.indexOf(q.c), pick: null };
  }
  function newDeck(ids) {
    var deck = shuffle(ids.slice());
    return { deck: deck, i: 0, cur: deck.length ? inst(deck[0]) : null, answered: false, right: 0, total: 0, done: false };
  }
  function newExam() {
    var ids = shuffle(pool(S.sel)).slice(0, EXAM_N);
    return { items: ids.map(inst), i: 0, done: false, confirm: false };
  }
  function freshState() {
    var sel = validSel(store.sel);
    return { mode: 'practica', sel: sel.length ? sel : TOPICS.map(function (_, i) { return i; }), panel: false, resetArm: false, recent: [], practica: null, simulacro: null, errores: null };
  }
  function stateIsValid(st) {
    try {
      if (!st || ['practica', 'simulacro', 'errores'].indexOf(st.mode) < 0 || !Array.isArray(st.sel)) return false;
      var okInst = function (x) { return x && BY_ID.has(x.id) && Array.isArray(x.opts); };
      ['practica', 'errores'].forEach(function (m) {
        var D = st[m];
        if (D && (!Array.isArray(D.deck) || !D.deck.every(function (id) { return BY_ID.has(id); }) || (D.cur && !okInst(D.cur)))) throw 0;
      });
      if (st.simulacro && (!Array.isArray(st.simulacro.items) || !st.simulacro.items.every(okInst))) throw 0;
      return true;
    } catch (e) { return false; }
  }
  function ensure() {
    if (S.mode === 'practica' && !S.practica) S.practica = newDeck(pool(S.sel));
    if (S.mode === 'simulacro' && !S.simulacro) S.simulacro = newExam();
    if (S.mode === 'errores' && !S.errores) S.errores = newDeck(errIds());
  }

  var S = null;

  /* ---------- Acciones ---------- */
  function setMode(m) {
    S.mode = m; S.resetArm = false;
    if (m === 'errores' && S.errores && (!S.errores.cur || S.errores.done)) S.errores = null;
    if (m === 'simulacro' && S.simulacro && !S.simulacro.items.length) S.simulacro = null;
    if (m === 'practica' && S.practica && !S.practica.cur && !S.practica.done) S.practica = null;
    ensure(); render();
  }
  function pickDeck(k) {
    var D = S[S.mode];
    if (!D || !D.cur || D.answered || k >= D.cur.opts.length) return;
    D.cur.pick = k; D.answered = true;
    var ok = k === D.cur.ok;
    D.total++; if (ok) D.right++;
    record(D.cur.id, ok);
    S.recent.push(ok ? 1 : 0); if (S.recent.length > 20) S.recent.shift();
    render();
    var nb = $('[data-act="next"]'); if (nb) nb.focus({ preventScroll: true });
  }
  function advanceDeck(skip) {
    var D = S[S.mode];
    if (!D || !D.cur || (!D.answered && !skip)) return;
    D.i++; D.answered = false;
    if (D.i >= D.deck.length) { D.done = true; D.cur = null; }
    else D.cur = inst(D.deck[D.i]);
    render(); focusQuestion();
  }
  function restartDeck() { S[S.mode] = newDeck(S.mode === 'errores' ? errIds() : pool(S.sel)); render(); focusQuestion(); }
  function pickExam(k) {
    var E = S.simulacro;
    if (!E || E.done || !E.items.length || k >= E.items[E.i].opts.length) return;
    E.items[E.i].pick = k; E.confirm = false; render();
  }
  function goExam(i) {
    var E = S.simulacro;
    if (!E || E.done || i < 0 || i >= E.items.length) return;
    E.i = i; E.confirm = false; render(); focusQuestion();
  }
  function finishExam(force) {
    var E = S.simulacro;
    if (!E || E.done) return;
    var pending = E.items.filter(function (x) { return x.pick === null; }).length;
    if (pending && !force) { E.confirm = true; render(); return; }
    E.done = true;
    E.items.forEach(function (x) { record(x.id, x.pick === x.ok); });
    render();
    var v = $('#view'); if (v) v.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
  }
  function newExamAction() { S.simulacro = newExam(); render(); focusQuestion(); }
  function practiceExamErrors() {
    var E = S.simulacro;
    var ids = E ? E.items.filter(function (x) { return x.pick !== x.ok; }).map(function (x) { return x.id; }) : [];
    S.mode = 'errores';
    S.errores = newDeck(ids.length ? ids : errIds());
    render(); focusQuestion();
  }
  function selectionChanged() {
    store.sel = S.sel.slice(); persist();
    S.practica = null;
    var E = S.simulacro;
    if (E && (E.done || E.items.every(function (x) { return x.pick === null; }))) S.simulacro = null;
    ensure();
  }
  function focusQuestion() {
    var q = $('#qtext');
    if (!q) return;
    q.focus({ preventScroll: true });
    var top = q.getBoundingClientRect().top;
    if (top < 0 || top > window.innerHeight * 0.6) {
      var card = q.closest('.card') || q;
      card.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
    }
  }

  /* ---------- Render ---------- */
  function render() {
    ['practica', 'simulacro', 'errores'].forEach(function (m) { $('#m-' + m).setAttribute('aria-pressed', S.mode === m ? 'true' : 'false'); });
    $('#errCount').textContent = errIds().length;
    $('#temasCount').textContent = S.sel.length + '/' + TOPICS.length;
    $('#temasBtn').setAttribute('aria-expanded', S.panel ? 'true' : 'false');
    var panel = $('#temasPanel');
    panel.hidden = !S.panel;
    if (S.panel) renderPanel(panel);
    renderPorts();
    renderView();
  }

  function renderPanel(el) {
    var rows = TOPICS.map(function (t, i) {
      var st = topicStats(i), n = st.n || 1;
      var on = S.sel.indexOf(i) >= 0;
      return '<label class="trow"><input type="checkbox" data-ti="' + i + '"' + (on ? ' checked' : '') + '>' +
        '<span class="tname">' + esc(t.n) + '<small>' + t.c + '</small></span>' +
        '<span class="tbar" aria-hidden="true"><i class="g" style="width:' + (st.ok / n * 100) + '%"></i><i class="r" style="width:' + (st.bad / n * 100) + '%"></i></span>' +
        '<span class="tnum">' + st.ok + ' bien · ' + st.bad + ' mal</span></label>';
    }).join('');
    el.innerHTML =
      '<div class="panel-head"><h2 class="panel-title">Temas</h2><div class="row-btns">' +
      '<button type="button" class="mini" data-act="selall">Todos</button>' +
      '<button type="button" class="mini" data-act="selnone">Ninguno</button>' +
      '<button type="button" class="mini' + (S.resetArm ? ' warn' : '') + '" data-act="reset">' + (S.resetArm ? 'Confirmar: borrar progreso' : 'Borrar progreso') + '</button>' +
      '</div></div>' +
      '<p class="legend"><span><i class="g"></i>última respuesta bien</span><span><i class="r"></i>última respuesta mal</span><span><i class="n"></i>sin responder</span></p>' +
      '<div class="trows">' + rows + '</div>' +
      '<p class="hint">Práctica y Simulacro usan los temas marcados. Errores repasa todas las preguntas cuya última respuesta fue incorrecta.</p>';
  }

  function portHTML(cls, label, n, clickable, i) {
    var tag = clickable ? 'button' : 'span';
    var attrs = clickable ? ' type="button" data-act="' + clickable + '" data-i="' + i + '" aria-label="' + esc(label) + '"' : ' aria-hidden="true"';
    return '<' + tag + ' class="port ' + cls + '"' + attrs + '><span class="led"></span><span class="jack"></span><span class="pnum">' + n + '</span></' + tag + '>';
  }

  function renderPorts() {
    var html = '', label = '', stat = '';
    if (S.mode === 'simulacro') {
      var E = S.simulacro;
      if (E && E.items.length) {
        var answered = E.items.filter(function (x) { return x.pick !== null; }).length;
        var right = E.items.filter(function (x) { return x.pick === x.ok; }).length;
        label = E.done ? 'Simulacro corregido' : 'Simulacro en curso';
        stat = E.done ? right + ' de ' + E.items.length + ' correctas' : answered + ' de ' + E.items.length + ' respondidas';
        html = E.items.map(function (x, i) {
          var cls = x.pick === null ? '' : 'ans';
          if (E.done) cls = x.pick === x.ok ? 'ok' : 'bad';
          if (!E.done && i === E.i) cls += ' cur';
          var st = E.done ? (x.pick === x.ok ? ', correcta' : ', incorrecta') : (x.pick === null ? ', sin responder' : ', respondida');
          return portHTML(cls, 'Pregunta ' + (i + 1) + st, i + 1, E.done ? 'review' : 'go', i);
        }).join('');
      } else { label = 'Simulacro'; stat = 'Sin preguntas'; }
    } else {
      var D = S[S.mode];
      label = S.mode === 'errores' ? 'Repaso de errores' : 'Práctica';
      stat = D && D.total ? D.right + ' de ' + D.total + ' bien en esta sesión' : 'Últimas 20 respuestas';
      var r = S.recent;
      for (var i = 0; i < 20; i++) {
        var cls = i < r.length ? (r[i] ? 'ok' : 'bad') : '';
        if (i === r.length && D && D.cur && !D.answered) cls += ' cur';
        html += portHTML(cls, '', i + 1, null, i);
      }
    }
    $('#plateLabel').textContent = label;
    $('#plateStat').textContent = stat;
    $('#ports').innerHTML = html;
  }

  function optsHTML(it, answered, selectable) {
    return it.opts.map(function (t, k) {
      var cls = 'opt', tag = '';
      if (answered) {
        if (k === it.ok) { cls += ' is-ok'; tag = '<span class="tag">Correcta</span>'; }
        else if (k === it.pick) { cls += ' is-bad'; tag = '<span class="tag">Tu respuesta</span>'; }
        else cls += ' is-dim';
      } else if (it.pick === k) cls += ' is-sel';
      var attrs = selectable && !answered ? ' data-act="pick" data-k="' + k + '"' : ' aria-disabled="true" tabindex="-1"';
      return '<li><button type="button" class="' + cls + '"' + attrs + ' aria-pressed="' + (it.pick === k) + '">' +
        '<span class="key" aria-hidden="true">' + LETTERS[k] + '</span><span class="otext"><span class="sr">Opción ' + LETTERS[k] + ': </span>' + inline(t) + '</span>' + tag + '</button></li>';
    }).join('');
  }

  function cardHTML(q, it, numLabel, answered, footer, fb) {
    return '<article class="card">' +
      '<div class="qmeta"><span class="qnum">' + numLabel + '</span><span class="chip">' + esc(TOPICS[q.t].n) + '</span></div>' +
      '<div class="qtext" id="qtext" tabindex="-1">' + rich(q.q) + '</div>' +
      '<ol class="opts" type="a">' + optsHTML(it, answered, true) + '</ol>' +
      (fb || '') + footer + '</article>';
  }

  function feedbackHTML(q, it) {
    var ok = it.pick === it.ok;
    return '<div class="fb ' + (ok ? 'ok' : 'bad') + '" role="status"><span class="led"></span>' +
      '<p class="verdict">' + (ok ? 'Correcto' : 'Incorrecto. La correcta es la <span class="lt">' + LETTERS[it.ok] + ')</span>') + '</p>' +
      '<p class="why">' + inline(q.e) + '</p></div>';
  }

  function emptyHTML(title, text, btn) {
    return '<article class="card empty"><h2>' + title + '</h2><p>' + text + '</p>' + (btn ? '<div class="actions">' + btn + '</div>' : '') + '</article>';
  }

  function renderView() {
    var v = $('#view'), html = '';
    if (S.mode === 'simulacro') html = examView();
    else html = deckView();
    v.innerHTML = html;
  }

  function deckView() {
    var D = S[S.mode], isErr = S.mode === 'errores';
    if (!D || (!D.cur && !D.done)) {
      if (isErr) return emptyHTML('Sin errores guardados', 'Acá aparecen las preguntas cuya última respuesta fue incorrecta. Respondé en Práctica o en Simulacro y volvé.', '<button type="button" class="btn primary" data-act="mode" data-mode="practica">Ir a Práctica</button>');
      return emptyHTML('No hay temas elegidos', 'Marcá al menos un tema en el panel de Temas para empezar.', '<button type="button" class="btn primary" data-act="openpanel">Elegir temas</button>');
    }
    if (D.done) {
      var pct = D.total ? Math.round(D.right / D.total * 100) : 0;
      var remaining = errIds().length;
      var btn = isErr
        ? (remaining ? '<button type="button" class="btn primary" data-act="restart">Repasar los ' + remaining + ' errores que quedan</button>' : '<button type="button" class="btn primary" data-act="mode" data-mode="simulacro">Hacer un simulacro</button>')
        : '<button type="button" class="btn primary" data-act="restart">Otra ronda con los mismos temas</button>';
      return emptyHTML(isErr ? 'Repaso terminado' : 'Ronda completa', D.right + ' de ' + D.total + ' bien (' + pct + '%).' + (isErr ? (remaining ? ' Quedan ' + remaining + ' preguntas en Errores.' : ' No quedan errores guardados.') : ''), btn);
    }
    var q = BY_ID.get(D.cur.id);
    var numLabel = (isErr ? 'Error ' : 'Pregunta ') + (D.i + 1) + ' / ' + D.deck.length;
    var footer = D.answered
      ? '<div class="actions"><span class="hint">' + D.right + ' de ' + D.total + ' bien</span><button type="button" class="btn primary" data-act="next">' + (D.i + 1 < D.deck.length ? 'Siguiente pregunta' : 'Ver resultado') + '</button></div>'
      : '<div class="actions"><span class="hint">Elegí una opción</span><button type="button" class="btn" data-act="skip">Saltar</button></div>';
    return cardHTML(q, D.cur, numLabel, D.answered, footer, D.answered ? feedbackHTML(q, D.cur) : '');
  }

  function examView() {
    var E = S.simulacro;
    if (!E || !E.items.length) return emptyHTML('No hay temas elegidos', 'Marcá al menos un tema en el panel de Temas para armar el simulacro.', '<button type="button" class="btn primary" data-act="openpanel">Elegir temas</button>');
    if (E.done) return resultsHTML(E);
    var it = E.items[E.i], q = BY_ID.get(it.id);
    var pending = E.items.filter(function (x) { return x.pick === null; }).length;
    var last = E.i === E.items.length - 1;
    var footer = '<div class="actions"><div class="grp">' +
      '<button type="button" class="btn" data-act="prev"' + (E.i === 0 ? ' disabled' : '') + '>Anterior</button>' +
      '<button type="button" class="btn' + (last ? '' : ' primary') + '" data-act="enext"' + (last ? ' disabled' : '') + '>Siguiente</button></div>' +
      '<button type="button" class="btn' + (last ? ' primary' : '') + '" data-act="finish">Corregir simulacro</button></div>';
    if (E.confirm) {
      footer += '<p class="notice">Quedan ' + pending + ' sin responder y se cuentan como incorrectas. <button type="button" class="mini" data-act="finishforce">Corregir igual</button></p>';
    }
    return cardHTML(q, it, 'Pregunta ' + (E.i + 1) + ' / ' + E.items.length, false, footer, '');
  }

  function resultsHTML(E) {
    var total = E.items.length;
    var right = E.items.filter(function (x) { return x.pick === x.ok; }).length;
    var nota = right / total * 10;
    var pass = nota >= PASS;
    var per = {};
    E.items.forEach(function (x) {
      var t = BY_ID.get(x.id).t;
      per[t] = per[t] || { ok: 0, n: 0 };
      per[t].n++; if (x.pick === x.ok) per[t].ok++;
    });
    var rows = Object.keys(per).map(Number).sort(function (a, b) { return a - b; }).map(function (t) {
      var p = per[t];
      return '<tr><td>' + esc(TOPICS[t].n) + '</td><td class="bar"><span class="tbar"><i class="g" style="width:' + (p.ok / p.n * 100) + '%"></i><i class="r" style="width:' + ((p.n - p.ok) / p.n * 100) + '%"></i></span></td><td class="num">' + p.ok + '/' + p.n + '</td></tr>';
    }).join('');
    var review = E.items.map(function (x, i) {
      var q = BY_ID.get(x.id), ok = x.pick === x.ok;
      var status = ok ? 'Correcta' : (x.pick === null ? 'Sin responder' : 'Incorrecta');
      return '<li class="rv ' + (ok ? 'ok' : 'bad') + '" id="rv-' + i + '">' +
        '<div class="rv-head"><span class="led"></span><span class="qnum">Pregunta ' + (i + 1) + ' · ' + status + '</span><span class="chip">' + esc(TOPICS[q.t].n) + '</span></div>' +
        '<div class="qtext">' + rich(q.q) + '</div>' +
        '<ol class="opts" type="a">' + optsHTML(x, true, false) + '</ol>' +
        '<p class="why">' + inline(q.e) + '</p></li>';
    }).join('');
    var wrong = total - right;
    return '<article class="card results">' +
      '<div class="score"><div class="nota">' + fmt(nota) + '</div><div class="score-side">' +
      '<span class="badge ' + (pass ? 'ok' : 'bad') + '">' + (pass ? 'Promociona' : 'No promociona') + '</span>' +
      '<p class="score-l">' + right + ' de ' + total + ' correctas. Nota estimada con ' + fmt(10 / total) + ' puntos por pregunta; se promociona con ' + PASS + '.</p></div></div>' +
      '<div class="actions"><div class="grp"><button type="button" class="btn primary" data-act="newexam">Nuevo simulacro</button>' +
      (wrong ? '<button type="button" class="btn" data-act="examerrors">Practicar estos ' + wrong + ' errores</button>' : '') + '</div></div>' +
      '<h2>Por tema</h2><div style="overflow-x:auto"><table class="tt"><tbody>' + rows + '</tbody></table></div>' +
      '<h2>Revisión</h2><ol class="review">' + review + '</ol>' +
      '</article>';
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.getAttribute('aria-disabled') === 'true' || b.disabled) return;
    var act = b.getAttribute('data-act');
    if (act !== 'reset') S.resetArm = false;
    switch (act) {
      case 'mode': setMode(b.getAttribute('data-mode')); break;
      case 'panel': S.panel = !S.panel; render(); if (S.panel) { var f = $('#temasPanel input'); if (f) f.focus({ preventScroll: false }); } break;
      case 'openpanel': S.panel = true; render(); var f2 = $('#temasPanel input'); if (f2) f2.focus({ preventScroll: false }); break;
      case 'selall': S.sel = TOPICS.map(function (_, i) { return i; }); selectionChanged(); render(); break;
      case 'selnone': S.sel = []; selectionChanged(); render(); break;
      case 'reset':
        if (!S.resetArm) { S.resetArm = true; render(); var rb = $('[data-act="reset"]'); if (rb) rb.focus(); }
        else { store.stats = {}; persist(); S.resetArm = false; S.recent = []; S.errores = null; ensure(); render(); }
        break;
      case 'pick':
        var k = +b.getAttribute('data-k');
        if (S.mode === 'simulacro') pickExam(k); else pickDeck(k);
        break;
      case 'next': advanceDeck(false); break;
      case 'skip': advanceDeck(true); break;
      case 'restart': restartDeck(); break;
      case 'prev': goExam(S.simulacro.i - 1); break;
      case 'enext': goExam(S.simulacro.i + 1); break;
      case 'go': goExam(+b.getAttribute('data-i')); break;
      case 'finish': finishExam(false); break;
      case 'finishforce': finishExam(true); break;
      case 'newexam': newExamAction(); break;
      case 'examerrors': practiceExamErrors(); break;
      case 'review':
        var target = document.getElementById('rv-' + b.getAttribute('data-i'));
        if (target) target.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
        break;
    }
  });

  document.addEventListener('change', function (e) {
    var cb = e.target;
    if (!cb.matches || !cb.matches('#temasPanel input[type="checkbox"]')) return;
    var ti = +cb.getAttribute('data-ti');
    var set = new Set(S.sel);
    if (cb.checked) set.add(ti); else set.delete(ti);
    S.sel = Array.from(set).sort(function (a, b) { return a - b; });
    selectionChanged(); render();
    var again = document.querySelector('#temasPanel input[data-ti="' + ti + '"]');
    if (again) again.focus({ preventScroll: true });
  });

  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    var el = e.target, tag = (el.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    var key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    var idx = '1234'.indexOf(key); if (idx < 0) idx = 'abcd'.indexOf(key);
    if (idx >= 0 && key.length === 1) {
      if (S.mode === 'simulacro') pickExam(idx); else pickDeck(idx);
      e.preventDefault(); return;
    }
    var onControl = el.closest && el.closest('button,a,label');
    if (key === 'Enter' && !onControl) {
      if (S.mode === 'simulacro') { var E = S.simulacro; if (E && !E.done) { if (E.i < E.items.length - 1) goExam(E.i + 1); else finishExam(false); } }
      else advanceDeck(false);
      e.preventDefault(); return;
    }
    if (key === 'ArrowRight' || key === 'ArrowLeft') {
      if (S.mode === 'simulacro' && S.simulacro && !S.simulacro.done) { goExam(S.simulacro.i + (key === 'ArrowRight' ? 1 : -1)); e.preventDefault(); }
      else if (key === 'ArrowRight' && S.mode !== 'simulacro') { advanceDeck(false); }
    }
  });

  /* ---------- Arranque ---------- */
  $('#sub').textContent = BANK.length + ' preguntas en ' + TOPICS.length + ' temas. Formato del parcial: 20 preguntas multiple choice, se promociona con 6.';

  function start(data) {
    var prev = data && data.S;
    S = stateIsValid(prev) ? prev : freshState();
    S.sel = validSel(S.sel);
    ensure();
    render();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(function () { return { S: S }; }); } catch (e) { } }
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start(hot && hot.data ? hot.data : {});
})();
</script>
</body>
</html>
