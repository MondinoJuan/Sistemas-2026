<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulacro Parcial Seguridad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E8EDEF; --surface:#FFFFFF; --surface-2:#F2F5F6; --ink:#13202A; --muted:#53646D;
  --line:#CFD8DC; --line-strong:#AAB8BF;
  --accent:#0A6A7B; --accent-ink:#FFFFFF; --accent-soft:#D6EBEE;
  --ok:#1B8749; --ok-bg:#DFF1E6; --bad:#BC392F; --bad-bg:#F8E2DF; --amber:#A96E05; --amber-bg:#FAEFD4;
  --plate:#1A272E; --plate-edge:#0E171C; --plate-ink:#9AABB3; --jack:#0A1216; --jack-edge:#34454E; --led-off:#3A4A53;
  --led-ok:#37D27C; --led-bad:#FF5B4F; --led-amber:#F3B232; --plate-hi:#D5DEE2;
  --f-disp:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0B1216; --surface:#121C22; --surface-2:#172229; --ink:#DDE5E9; --muted:#8B9DA6;
    --line:#22303A; --line-strong:#364852;
    --accent:#58B8C7; --accent-ink:#03181C; --accent-soft:#113039;
    --ok:#4ACB81; --ok-bg:#0F2C1D; --bad:#F3726B; --bad-bg:#361614; --amber:#EAB04A; --amber-bg:#32260E;
    --plate:#060C0F; --plate-edge:#1F2C33; --plate-ink:#7E929C; --jack:#020506; --jack-edge:#27373F; --led-off:#22313A;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0B1216; --surface:#121C22; --surface-2:#172229; --ink:#DDE5E9; --muted:#8B9DA6;
  --line:#22303A; --line-strong:#364852;
  --accent:#58B8C7; --accent-ink:#03181C; --accent-soft:#113039;
  --ok:#4ACB81; --ok-bg:#0F2C1D; --bad:#F3726B; --bad-bg:#361614; --amber:#EAB04A; --amber-bg:#32260E;
  --plate:#060C0F; --plate-edge:#1F2C33; --plate-ink:#7E929C; --jack:#020506; --jack-edge:#27373F; --led-off:#22313A;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:16px}
@media (min-width:640px){.wrap{padding-inline:24px}}

/* Encabezado */
.top{display:flex;flex-direction:column;gap:6px}
.eyebrow{margin:0;font:600 13px/1.2 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font:700 clamp(32px,6vw,44px)/1 var(--f-disp);letter-spacing:.01em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);max-width:64ch}

/* Barra de modos */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.modes{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.modes button,.ghost{appearance:none;border:0;background:transparent;font:600 15px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;padding:11px 14px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.modes button+button{border-left:1px solid var(--line)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.modes button:not([aria-pressed="true"]):hover{background:var(--surface-2)}
.ghost{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.ghost:hover,.ghost[aria-expanded="true"]{border-color:var(--accent)}
.cnt{font:500 12px/1 var(--f-mono);letter-spacing:0;padding:3px 6px;border-radius:4px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.modes button[aria-pressed="true"] .cnt{border-color:currentColor}
@media (max-width:420px){.modes{width:100%}.modes button{flex:1;justify-content:center;padding-inline:8px}.ghost{width:100%;justify-content:center}}

/* Panel de temas */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center}
.panel-title{margin:0;font:700 18px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.mini{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 10px;font:600 13px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.mini:hover{border-color:var(--accent)}
.mini.warn{border-color:var(--bad);color:var(--bad)}
.legend{margin:0;font:500 12px/1.4 var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.legend i{display:inline-block;width:10px;height:6px;border-radius:2px;margin-right:6px;vertical-align:middle}
.trows{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) 110px auto;gap:10px;align-items:center;padding:8px 6px;border-radius:6px;cursor:pointer}
.trow:hover{background:var(--surface-2)}
.trow input{width:17px;height:17px;margin:0;accent-color:var(--accent)}
.tname{font-size:14.5px;line-height:1.3}
.tname small{color:var(--muted);font:500 12px var(--f-mono);margin-left:6px}
.tbar{display:flex;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.g{background:var(--ok)} .r{background:var(--bad)} .n{background:var(--line)}
.tnum{font:500 12px/1 var(--f-mono);color:var(--muted);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.trow{grid-template-columns:auto minmax(0,1fr) auto}.tbar{grid-column:2 / 4;grid-row:2}}

/* Frente del switch: progreso */
.plate{background:var(--plate);border:1px solid var(--plate-edge);border-radius:8px;padding:10px 12px 9px;color:var(--plate-ink)}
.plate-head{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font:500 11px/1.3 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;margin-bottom:9px}
.plate-head b{color:var(--plate-hi);font-weight:500}
.ports{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:6px}
@media (max-width:600px){.ports{grid-template-columns:repeat(10,minmax(0,1fr));row-gap:10px}}
.port{appearance:none;background:none;border:0;padding:0;margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:default;min-width:0}
button.port{cursor:pointer}
.led{display:block;width:7px;height:7px;border-radius:50%;background:var(--led-off);flex:none}
.jack{position:relative;display:block;width:100%;max-width:28px;aspect-ratio:5 / 4;background:var(--jack);border:1px solid var(--jack-edge);border-radius:2px}
.jack::after{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:30%;background:var(--plate);border:1px solid var(--jack-edge);border-bottom:0;border-radius:2px 2px 0 0}
.pnum{font:500 10px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.port.ans .led{background:var(--led-amber);box-shadow:0 0 6px var(--led-amber)}
.port.ok .led{background:var(--led-ok);box-shadow:0 0 6px var(--led-ok)}
.port.bad .led{background:var(--led-bad);box-shadow:0 0 6px var(--led-bad)}
.port.cur .jack{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.port.cur .pnum{color:var(--plate-hi)}
button.port:hover .jack{border-color:var(--plate-ink)}

/* Tarjeta de pregunta */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
@media (min-width:640px){.card{padding:24px 28px}}
.qmeta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.qnum{font:500 12px/1 var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.chip{font:600 13px/1.15 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 8px;border-radius:4px}
.qtext{margin:0;font:500 18px/1.45 var(--f-body);display:flex;flex-direction:column;gap:8px;outline:none}
.qtext p{margin:0}
pre.code{margin:0;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow-x:auto;font:500 13.5px/1.6 var(--f-mono);white-space:pre}
code{font-family:var(--f-mono);font-size:.9em;background:var(--surface-2);padding:1px 4px;border-radius:3px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;padding:11px 14px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font:400 15.5px/1.45 var(--f-body);cursor:pointer;transition:border-color .12s ease,background-color .12s ease}
.opt:hover{border-color:var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt[aria-disabled="true"]:hover{border-color:var(--line-strong)}
.otext{padding-top:3px;overflow-wrap:anywhere}
.key{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;border:1px solid var(--line-strong);font:600 14px/1 var(--f-mono);color:var(--muted)}
.opt.is-sel{border-color:var(--amber);background:var(--amber-bg)}
.opt.is-sel .key{border-color:var(--amber);color:var(--amber)}
.opt.is-ok,.opt.is-ok:hover{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-ok .key{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.is-bad,.opt.is-bad:hover{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-bad .key{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.is-dim{opacity:.6}
.tag{font:600 12.5px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;align-self:center;white-space:nowrap}
.is-ok .tag{color:var(--ok)} .is-bad .tag{color:var(--bad)}
@media (max-width:480px){.opt{grid-template-columns:28px minmax(0,1fr)}.tag{grid-column:2}}

.fb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;padding:14px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.fb .led{margin-top:6px;width:9px;height:9px}
.fb.ok .led{background:var(--led-ok);box-shadow:0 0 6px var(--led-ok)}
.fb.bad .led{background:var(--led-bad);box-shadow:0 0 6px var(--led-bad)}
.verdict{margin:0;font:700 17px/1.2 var(--f-disp);letter-spacing:.06em;text-transform:uppercase}
.fb.ok .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.verdict .lt{text-transform:none;font-family:var(--f-mono);font-size:.9em;letter-spacing:0}
.why{margin:4px 0 0;max-width:68ch}
.fb .why{grid-column:2}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.actions .grp{display:flex;flex-wrap:wrap;gap:10px}
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);font:600 15px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;padding:12px 16px;border-radius:8px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{margin:0;font:500 12px/1.4 var(--f-mono);color:var(--muted)}
.notice{margin:0;padding:10px 12px;border-radius:6px;background:var(--amber-bg);color:var(--ink);border:1px solid var(--amber)}

/* Estados vacíos y resultados */
.empty h2,.results h2{margin:0;font:700 22px/1.1 var(--f-disp);letter-spacing:.04em;text-transform:uppercase}
.empty p{margin:0;color:var(--muted);max-width:60ch}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 22px;align-items:center}
.nota{font:700 clamp(64px,15vw,92px)/.85 var(--f-disp);font-variant-numeric:tabular-nums}
.score-side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.badge{display:inline-flex;gap:8px;align-items:center;font:700 19px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-radius:6px}
.badge.ok{color:var(--ok);background:var(--ok-bg)} .badge.bad{color:var(--bad);background:var(--bad-bg)}
.score-l{margin:0;color:var(--muted)}
.tt{width:100%;border-collapse:collapse;font-size:14.5px}
.tt td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tt td.num{text-align:right;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px;width:1%}
.tt td.bar{width:34%;padding-left:12px}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rv{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px}
.rv-head{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.rv.ok .rv-head .led{background:var(--ok)} .rv.bad .rv-head .led{background:var(--bad)}
.rv .qtext{font-size:16px}
.rv .opt{font-size:14.5px;padding:9px 12px;cursor:default}
.rv .opt:hover{border-color:var(--line-strong)}
.rv .opt.is-ok:hover{border-color:var(--ok)} .rv .opt.is-bad:hover{border-color:var(--bad)}
.rv .key{width:24px;height:24px;font-size:13px}
.rv .opt{grid-template-columns:24px minmax(0,1fr) auto}
.foot{margin:4px 0 0;font:500 12px/1.6 var(--f-mono);color:var(--muted)}
.foot kbd{font:inherit;border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;background:var(--surface)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">UTN FRRo · Seguridad de los Sistemas de Información</p>
    <h1>Simulacro del parcial 1</h1>
    <p class="sub" id="sub"></p>
  </header>

  <nav class="bar" aria-label="Modo de estudio">
    <div class="modes">
      <button type="button" id="m-practica" data-act="mode" data-mode="practica" aria-pressed="true">Práctica</button>
      <button type="button" id="m-simulacro" data-act="mode" data-mode="simulacro" aria-pressed="false">Simulacro <span class="cnt">20</span></button>
      <button type="button" id="m-errores" data-act="mode" data-mode="errores" aria-pressed="false">Errores <span class="cnt" id="errCount">0</span></button>
    </div>
    <button type="button" class="ghost" id="temasBtn" data-act="panel" aria-expanded="false" aria-controls="temasPanel">Temas <span class="cnt" id="temasCount"></span></button>
  </nav>

  <section class="panel" id="temasPanel" hidden aria-label="Temas incluidos"></section>

  <section class="plate" aria-label="Progreso">
    <div class="plate-head"><span id="plateLabel"></span><b id="plateStat"></b></div>
    <div class="ports" id="ports"></div>
  </section>

  <main id="view"></main>

  <p class="foot">Atajos: <kbd>1</kbd>-<kbd>4</kbd> o <kbd>a</kbd>-<kbd>d</kbd> eligen, <kbd>Enter</kbd> avanza, <kbd>&larr;</kbd> <kbd>&rarr;</kbd> recorren el simulacro. Las opciones se mezclan en cada intento. El progreso queda guardado en este navegador.</p>
</div>

cional. Una no funciona sin la otra."},{"id":"933a754aa8","t":0,"q":"Según el material, ¿qué debería ser la base de la política de seguridad?","c":"El análisis de riesgos.","d":["La norma ISO 27001.","El inventario de firewalls y equipos de red.","El plan de contingencia ante desastres."],"f":[],"cf":false,"e":"La política se desarrolla mediante un plan director; la dirección marca las líneas de actuación y el análisis de riesgos debería ser su base."},{"id":"2ac87c751d","t":0,"q":"¿Quién marca las líneas de actuación de la política de seguridad?","c":"La dirección de la organización.","d":["El equipo de seguridad informática.","Los administradores de sistemas.","El proveedor del firewall perimetral."],"f":[],"cf":false,"e":"La dirección marca las líneas; el plan director define las medidas; el equipo de seguridad y los administradores ejecutan las medidas técnicas."},{"id":"62107b5b4f","t":0,"q":"¿Cuál NO es un beneficio de implementar la norma ISO 27001 según el material?","c":"Elimina por completo los riesgos y las amenazas.","d":["Reduce el impacto de los riesgos y las amenazas.","Establece garantías de continuidad del negocio ante una contingencia.","Da una imagen de prestigio frente a terceros."],"f":[],"cf":false,"e":"Ninguna norma elimina el riesgo: reduce su impacto y mejora la planificación y la gestión de la seguridad."},{"id":"5c96b12261","t":0,"q":"¿Cuáles son las cuatro acciones de la gestión del riesgo según el material?","c":"Prevenir, transferir, mitigar y aceptar.","d":["Identificar, proteger, detectar y responder.","Prevenir, detectar, corregir y documentar.","Evitar, cifrar, respaldar y auditar."],"f":[],"cf":false,"e":"Prevenir (evitar que ocurra), transferir (pasarlo a un tercero), mitigar (reducir su impacto) y aceptar (asumirlo conscientemente)."},{"id":"98e36a0d67","t":0,"q":"Una empresa contrata un seguro que cubre las pérdidas por ciberataques. En la gestión del riesgo, eso es:","c":"Transferir el riesgo.","d":["Mitigar el riesgo.","Aceptar el riesgo.","Prevenir el riesgo."],"f":[],"cf":false,"e":"Transferir es pasar el riesgo a un tercero. Mitigar sería reducir el impacto con medidas propias."},{"id":"7b601faad1","t":0,"q":"Según el material, ¿cuál es el eslabón más débil de la cadena de seguridad y por qué?","c":"Los usuarios, porque no se pueden controlar.","d":["La infraestructura, porque es el elemento que más riesgos corre.","La información, porque es el principal activo de la organización.","Los protocolos de Internet, porque no se diseñaron pensando en la seguridad."],"f":[],"cf":false,"e":"Usuarios, información e infraestructura son los tres elementos a proteger. La infraestructura puede ser el medio más controlado, aunque no el que menos riesgos corre."},{"id":"6c0efa7bd4","t":0,"q":"Sobre la infraestructura como elemento a proteger, el material dice que:","c":"Puede ser el medio más controlado, pero no el que menos riesgos corre.","d":["Es el principal activo que se desea mantener a salvo.","Es el eslabón más débil porque no se puede controlar.","Solo está expuesta a ataques remotos por Internet, no a desastres naturales."],"f":[],"cf":false,"e":"El principal activo es la información y el eslabón más débil son los usuarios. La infraestructura incluye robos, accesos no permitidos, incendios e inundaciones."},{"id":"e3db72b2df","t":0,"q":"¿Cuáles son los tres tipos de deficiencias que causan la inseguridad según el material?","c":"Tecnológicas, de política de seguridad y de configuración.","d":["Humanas, físicas, de software, de red y de configuración de equipos.","Tecnológicas, humanas y legales.","De red, de hardware y de configuración."],"f":[],"cf":false,"e":"La trampa es mezclarlas con los cinco tipos de vulnerabilidades (software, configuración, red, físicas y humanas)."},{"id":"b884ac4039","t":0,"q":"Un empleado conecta a la red de la oficina un punto de acceso inalámbrico propio, sin autorización. Según el material, es una deficiencia:","c":"De la política de seguridad.","d":["Tecnológica, porque WiFi no se diseñó pensando en la seguridad.","De configuración, porque el equipo trae una contraseña por defecto.","Ninguna, si el equipo queda dentro de la oficina."],"f":[],"cf":false,"e":"Es falta de criterios para cambios de hardware o software. El material lo llama \"una puerta trasera virtual\"."},{"id":"26a6b4d9d1","t":0,"q":"El síndrome de \"aquí todos somos como una familia\" corresponde, según el material, a:","c":"Políticas internas laxas.","d":["Una deficiencia de configuración.","Una deficiencia tecnológica.","Una técnica de ingeniería social."],"f":[],"cf":false,"e":"Es una deficiencia de la política de seguridad: genera un ambiente cómodo para el atacante."},{"id":"4913132438","t":0,"q":"¿Cuál NO es una deficiencia de configuración según el material?","c":"La alta rotación de personal en cargos de responsabilidad.","d":["Contraseñas por defecto o sin renovar.","Puertos o servicios innecesarios activos.","Usuarios y contraseñas que viajan sin cifrar por la red interna."],"f":[],"cf":false,"e":"La alta rotación es una política de empleo, dentro de las deficiencias de la política de seguridad."},{"id":"47984ff62f","t":0,"q":"Según el material, ¿por qué es difícil identificar a un atacante de red cuando no hay mecanismos de protección adecuados?","c":"Porque no quedan huellas y el marco legal está desactualizado.","d":["Porque el atacante necesita contacto físico con la víctima.","Porque los protocolos de Internet ocultan la IP de origen de cada paquete.","Porque los ataques solo se pueden detectar después de un backup."],"f":[],"cf":false,"e":"Además, el atacante de red no necesita contacto físico y la naturaleza en tiempo real de Internet vuelve instantánea la delincuencia."},{"id":"cd27fc635b","t":0,"q":"Según el material, ¿cuál es la característica elemental para considerar que un programa es un virus?","c":"Que pueda reproducirse y generar copias.","d":["Que elimine archivos del sistema.","Que se oculte dentro de un programa aparentemente legítimo.","Que robe información del usuario sin que lo note."],"f":[],"cf":false,"e":"El software malicioso que no se reproduce causa daño, pero no se considera virus como tal."},{"id":"58f032f088","t":0,"q":"Un malware permanece inactivo hasta que el usuario abre el navegador o se cumple una fecha. Es:","c":"Una bomba de tiempo.","d":["Un gusano en estado latente.","Un rootkit.","Un dialer."],"f":[],"cf":false,"e":"Las bombas de tiempo se activan al pasar cierto tiempo o al producirse un evento determinado."},{"id":"d5a1e1a479","t":0,"q":"Según el lugar de infección, ¿cuál NO es un tipo de virus mencionado en el material?","c":"De registros DNS.","d":["De sector de arranque (boot).","De macros.","De lenguajes de script."],"f":[],"cf":false,"e":"Los tipos por lugar de infección son: sector de arranque, archivos ejecutables, macros y lenguajes de script."},{"id":"1dfaa2f245","t":0,"q":"La huella dactilar corresponde al factor de autenticación:","c":"Característica física.","d":["Algo que se posee.","Algo conocido.","Ninguno: la biometría no es un factor de autenticación."],"f":[],"cf":false,"e":"Voz, huella, ojo y escritura son características físicas; según el material es el tipo más nuevo."},{"id":"71ffcc273c","t":0,"q":"Un token que genera números aleatorios es un factor de autenticación de tipo:","c":"Algo que se posee.","d":["Algo conocido, porque el usuario tiene que leer el número.","Característica física.","Autenticación de actualidad."],"f":[],"cf":false,"e":"El token es un objeto, como una tarjeta o un pasaporte. Que el usuario lea el número no lo convierte en algo conocido."},{"id":"7cc53eb76c","t":0,"q":"¿Cuál afirmación sobre la autenticación es correcta según el material?","c":"Los factores no son excluyentes: se pueden combinar hasta tres.","d":["Cada sistema debe elegir un único factor para no molestar al usuario.","La contraseña es el factor más seguro porque solo la conoce el usuario.","Solo se aplica a usuarios, nunca a dispositivos o datos."],"f":[],"cf":false,"e":"La contraseña solo la conoce el usuario \"en teoría\", y la autenticación también se aplica a sistemas, dispositivos y datos. Hay que evaluar costo contra beneficio."},{"id":"992bb7402a","t":0,"q":"¿Qué caracteriza a los mecanismos correctivos?","c":"Se aplican después del incidente y son muy costosos.","d":["Se aplican antes del incidente para evitar que ocurra.","Son los más complejos y parten de la premisa de que ya hubo una intrusión.","Son baratos, porque reutilizan soluciones ya documentadas."],"f":[],"cf":false,"e":"La segunda distractora describe a los mecanismos detectivos."},{"id":"2090663b2d","t":0,"q":"¿Cuál es el orden de los pasos de un mecanismo correctivo?","c":"Catalogación, análisis del problema, análisis de la solución, documentación.","d":["Análisis del problema, catalogación y asignación, documentación y análisis de la solución.","Detección, contención, erradicación y recuperación de los servicios afectados.","Catalogación, análisis de la solución, análisis del problema y documentación."],"f":[],"cf":false,"e":"Primero se clasifica el problema, después lo analizan expertos, se analiza la solución antes de aplicarla y se documenta todo."},{"id":"29884b4b22","t":0,"q":"En un mecanismo correctivo, el análisis del problema lo realizan generalmente:","c":"Expertos, y no las personas involucradas.","d":["Las personas involucradas, porque conocen el sistema.","El usuario que detectó el problema.","El proveedor del antivirus."],"f":[],"cf":false,"e":"Lo dice explícitamente el material."},{"id":"53b8f87acb","t":0,"q":"¿Cuáles son los dos objetivos de los mecanismos detectivos?","c":"Detectar el punto exacto del ataque y la actividad sospechosa.","d":["Bloquear el ataque y documentar la solución aplicada.","Prevenir el ataque y transferir el riesgo a un tercero.","Catalogar el problema y analizar la solución antes de aplicarla."],"f":[],"cf":false,"e":"Si no se encuentra el punto del ataque, al menos hay que saber qué sucedió y partir de ahí."},{"id":"cbcc7114ce","t":0,"q":"En la detección de intrusiones, encontrar la transacción de subida o descarga de información equivale a:","c":"Encontrar el objetivo del atacante.","d":["Encontrar el punto exacto de entrada.","Bloquear automáticamente el ataque.","Identificar al atacante."],"f":[],"cf":false,"e":"La mayoría de los intentos incluyen al menos una transacción de ese tipo."},{"id":"427c61bd7c","t":0,"q":"Según el material, el paro absoluto (bloquear el sistema completo) es:","c":"Drástico, pero a veces la mejor opción.","d":["Una práctica prohibida porque afecta la disponibilidad.","El primer paso de la detección de intrusiones.","Un paso del mecanismo correctivo de documentación."],"f":[],"cf":false,"e":"Es parte del bloqueo automático: sin un mecanismo de emergencia, el atacante puede seguir actuando aunque el problema ya esté identificado."},{"id":"a731e7b374","t":0,"q":"Un atacante analiza el tráfico cifrado entre dos entidades para deducir cuándo y con qué frecuencia se comunican, sin modificar nada. Es un ataque:","c":"Pasivo (análisis de tráfico).","d":["Activo (repetición).","Activo (hombre en el medio).","Pasivo (suplantación de identidad)."],"f":[],"cf":false,"e":"El análisis de tráfico funciona incluso con mensajes cifrados. La suplantación de identidad es un ataque activo."},{"id":"56e5a6a759","t":0,"q":"Los ataques pasivos ponen en peligro:","c":"Solo la confidencialidad.","d":["La integridad y la disponibilidad.","La confidencialidad, la integridad y la autenticación.","Solo la disponibilidad del servicio."],"f":[],"cf":false,"e":"El atacante pasivo monitorea sin modificar ni añadir datos. La tercera opción describe a los activos."},{"id":"1fb84e9e86","t":0,"q":"Un atacante captura una transferencia bancaria válida y la retransmite más tarde. Es un ataque activo de:","c":"Repetición.","d":["Modificación de mensajes.","Suplantación de identidad.","Análisis de tráfico."],"f":[],"cf":false,"e":"La repetición reenvía o retarda una transmisión válida. El servicio que la detecta es la autenticación de actualidad (no replay)."},{"id":"9cfa0a1d29","t":0,"q":"Un atacante entra a la red de una empresa de defensa y permanece meses sin ser detectado, extrayendo información. Es:","c":"Una amenaza avanzada persistente (APT).","d":["Un ataque de denegación de servicio distribuido.","Un ataque pasivo de espionaje.","Un ataque de repetición."],"f":[],"cf":false,"e":"La APT busca robar datos más que causar daños y apunta a sectores de alto valor informativo, como defensa o finanzas."},{"id":"b343fc2d79","t":0,"q":"¿Cuál NO es un ataque activo según el material?","c":"Análisis de tráfico.","d":["Hombre en el medio.","Repetición.","Suplantación de identidad."],"f":[],"cf":false,"e":"El análisis de tráfico es pasivo. Los activos son suplantación, repetición, modificación, MitM, DoS/DDoS y APT."},{"id":"3f18014bcb","t":0,"q":"Un empleado con acceso legítimo a la red intenta entrar a datos a los que no debería. Según el material es un atacante:","c":"Interno.","d":["Externo, porque accede a datos ajenos.","Script kiddie.","Cracker externo."],"f":[],"cf":false,"e":"Interno es quien tiene acceso legítimo a la red y hace mal uso de él."},{"id":"f1de039451","t":0,"q":"¿Cuál es el grupo de atacantes más numeroso según el material?","c":"Los script kiddies.","d":["Los crackers.","Los atacantes profesionales.","Los hackers éticos."],"f":[],"cf":false,"e":"Tienen conocimientos limitados y ejecutan código que encuentran en la web sin saber qué hace."},{"id":"0079730a9c","t":0,"q":"¿Qué diferencia a un hacker de un cracker según el material?","c":"La ética: el cracker usa sus conocimientos de forma poco ética.","d":["El cracker tiene conocimientos limitados y ejecuta código que encuentra en la web.","El hacker ataca desde afuera de la red y el cracker desde adentro.","Ninguna: son sinónimos."],"f":[],"cf":false,"e":"La primera distractora describe al script kiddie."},{"id":"dfdca0b077","t":0,"q":"Según el material, una contraseña segura es la que:","c":"No aparece en ningún diccionario.","d":["Tiene exactamente 8 caracteres.","Combina el nombre y la fecha de nacimiento del usuario.","Se repite en todos los servicios para no olvidarla."],"f":[],"cf":false,"e":"Se recomiendan combinaciones sin sentido sintáctico, al menos 8 caracteres y mezcla de mayúsculas, minúsculas y números."},{"id":"e8bc5cfc5c","t":0,"q":"¿Cuál de estas prácticas NO recomienda el material para una contraseña robusta?","c":"Usar secuencias de teclado como qwerty.","d":["Usar al menos 8 caracteres.","Cambiarla aproximadamente cada 60 días.","Poner alguna mayúscula fuera del inicio."],"f":[],"cf":false,"e":"Las secuencias de teclado parecen texto sin sentido pero son fáciles de romper."},{"id":"a9d15c10ef","t":0,"q":"Según el material, ¿cada cuánto conviene cambiar una contraseña y cuándo se puede volver a usar?","c":"Cada 60 días, y no reutilizarla antes de un año.","d":["Cada 30 días, y no reutilizarla nunca.","Cada 90 días, y no reutilizarla antes de 6 meses.","Una vez por año, y reutilizarla después de 60 días."],"f":[],"cf":false,"e":"Son los plazos que da el material."},{"id":"3902eb40b1","t":0,"q":"Ante la sospecha de que una clave fue comprometida, el material recomienda:","c":"Cambiar todas las contraseñas de usuario.","d":["Cambiar solo la contraseña comprometida.","Esperar a que se confirme el incidente antes de cambiar nada.","Desactivar el firewall para analizar el tráfico."],"f":[],"cf":false,"e":"Las contraseñas de administrador son las más críticas."},{"id":"85cd8d2a4a","t":0,"q":"El antivirus se compone de:","c":"El motor de análisis y los archivos de firma.","d":["El firewall y el IDS.","Las reglas de filtrado y la política por defecto.","La base de hashes y el sandbox."],"f":[],"cf":false,"e":"Ambos deben actualizarse periódicamente. El antivirus no es 100% efectivo, pero es mejor que ninguna protección."},{"id":"57450e6da6","t":0,"q":"¿Por qué el material recomienda no abrir adjuntos desconocidos aunque el correo venga de una dirección conocida?","c":"Porque así se propagó el virus Melissa.","d":["Porque las direcciones conocidas siempre son falsificadas.","Porque el firewall bloquea los adjuntos de remitentes conocidos.","Porque los adjuntos de conocidos no pasan por el antivirus."],"f":[],"cf":false,"e":"Lo recomendado: actualizar el antivirus, guardar el archivo, escanearlo y recién ahí abrirlo."},{"id":"02c71fc1a9","t":0,"q":"Según el material, las copias de seguridad y el disco de arranque se guardan:","c":"En un medio extraíble y en un lugar alejado del equipo.","d":["En el mismo equipo, en una partición oculta.","En la misma sala que el servidor, para restaurar más rápido.","Solo en la nube, nunca en medios extraíbles."],"f":[],"cf":false,"e":"Guardar los backups junto a los sistemas es una vulnerabilidad física."},{"id":"cae4ad0799","t":0,"q":"Según el material, un sistema de cifrado se considera bueno cuando:","c":"La seguridad reside en la clave y no en el algoritmo.","d":["El algoritmo se mantiene en secreto para que nadie pueda analizarlo.","Usa claves de al menos 256 bits.","Combina cifrado simétrico con funciones hash."],"f":[],"cf":false,"e":"Conocer el algoritmo no debe permitir descifrar la información sin la clave."},{"id":"0f7d3a7c54","t":0,"q":"¿Cuáles son los tres objetivos principales de la encriptación según el material?","c":"Confidencialidad, autenticación e integridad.","d":["Confidencialidad, integridad y disponibilidad.","Autenticación, no repudio y disponibilidad.","Integridad, disponibilidad y trazabilidad."],"f":[],"cf":false,"e":"La trampa es la tríada CIA: la encriptación no garantiza disponibilidad."},{"id":"7865106601","t":0,"q":"En el material, MD5 y SHA aparecen como ejemplos de encriptación asimétrica. En rigor son:","c":"Funciones hash.","d":["Algoritmos de cifrado simétrico.","Algoritmos de clave pública, como RSA.","Protocolos de VPN."],"f":[],"cf":false,"e":"Son funciones de resumen unidireccionales, no algoritmos de cifrado de clave pública."},{"id":"d61a9be55b","t":0,"q":"Según el material, ¿de cuántos bits es la clave de DES?","c":"56 bits.","d":["64 bits.","128 bits.","1024 bits."],"f":[],"cf":false,"e":"No confundir: DES usa una clave de 56 bits y cifra bloques de 64 bits."},{"id":"a2efcfbbd9","t":0,"q":"¿Cuál de estos algoritmos simétricos usa clave de 128 bits según el material?","c":"IDEA","d":["RSA","DSA","SHA-1"],"f":[],"cf":false,"e":"RSA y DSA son asimétricos; SHA-1 es una función hash."},{"id":"dc69f8e50f","t":0,"q":"Según el material, ¿cuál es la opción de WEP más usada?","c":"128 bits.","d":["64 bits.","256 bits.","1024 bits."],"f":[],"cf":false,"e":"WEP tiene opciones de 64, 128 y 256 bits; la de 128 es la más usada y la de 256 no la soportan todos los dispositivos."},{"id":"a5e3e49fc6","t":0,"q":"Según el material, además de autenticar al emisor, la firma digital suele incluir:","c":"La hora y la fecha.","d":["La clave privada del emisor.","La clave de sesión sin cifrar.","La contraseña del usuario."],"f":[],"cf":false,"e":"Nunca se envía la clave privada: se usa para firmar y se queda con el emisor."},{"id":"2c4868c025","t":0,"q":"Según el material, ¿qué tipo de ataque \"suele dar muy buenos resultados\" a los atacantes?","c":"La ingeniería social.","d":["Los ataques a protocolos.","El espionaje de red.","La adivinación de contraseñas."],"f":[],"cf":false,"e":"Consiste en hacerse pasar por un usuario legítimo o un administrador, o en engañar a la gente para que revele claves."},{"id":"1b7fa78dfc","t":1,"q":"¿Qué servicio de seguridad permite detectar que un atacante capturó un mensaje legítimo y lo reenvió más tarde?","c":"Autenticación de actualidad (no replay).","d":["No repudio en destino.","Integridad de la información, que detecta cualquier alteración o reenvío del mensaje.","Autenticación del remitente."],"f":[],"cf":false,"e":"El no replay prueba que el mensaje es actual y no uno antiguo reenviado. La integridad solo asegura que no se alteró: un mensaje reenviado intacto la cumple."},{"id":"23dec0f764","t":1,"q":"¿Cuál de las siguientes afirmaciones es correcta?","c":"La criptología agrupa a la criptografía y al criptoanálisis.","d":["El criptoanálisis es una rama de la criptografía dedicada a diseñar algoritmos de cifrado más robustos.","La criptografía engloba a la criptología y al criptoanálisis.","Criptografía y criptología son sinónimos; el criptoanálisis es una disciplina independiente de ambas."],"f":[],"cf":false,"e":"Criptografía cifra, criptoanálisis rompe, criptología es el término que agrupa ambas."},{"id":"67c034497e","t":1,"q":"La escítala espartana es un ejemplo de cifrado por:","c":"Transposición.","d":["Sustitución monoalfabética con desplazamiento fijo de tres posiciones.","Sustitución polialfabética.","Sustitución por pares fila y columna en una tabla de 5x5."],"f":[],"cf":false,"e":"La escítala fue el primer sistema de transposición: las letras no se cambian, se reordenan. El desplazamiento de 3 es César y la tabla 5x5 es Polybios."},{"id":"6d8a14bf48","t":1,"q":"¿En qué se diferencia ROT-13 del cifrado César?","c":"En que desplaza 13 posiciones en lugar de 3.","d":["En que usa trece alfabetos distintos de forma cíclica, por lo que es polialfabético.","En que es un cifrado de transposición y no de sustitución.","En que necesita una clave secreta de 13 caracteres compartida entre emisor y receptor."],"f":[],"cf":false,"e":"ROT-13 es igual a César (sustitución monoalfabética), solo cambia el desplazamiento."},{"id":"0c64dbfcf9","t":1,"q":"Con el cifrado César (desplazamiento de 3), el criptograma \"FLIUDU\" se descifra como:","c":"CIFRAR","d":["ILOXGX","CIFRAS","COFRAR"],"f":[],"cf":false,"e":"Se resta 3 a cada letra: F>C, L>I, I>F, U>R, D>A, U>R. \"ILOXGX\" es el resultado de volver a cifrar (sumar 3), no de descifrar."},{"id":"660468abc2","t":1,"q":"El ataque por análisis de frecuencias es especialmente efectivo contra:","c":"Los cifrados monoalfabéticos, porque conservan las propiedades estadísticas del texto claro.","d":["El cifrado de Vigenère, porque la letra E del texto claro siempre se cifra con la misma letra.","AES, porque divide el mensaje en bloques de tamaño fijo que repiten patrones.","RSA, porque la clave pública es conocida por todos."],"f":[],"cf":false,"e":"Los polialfabéticos como Vigenère fueron creados justamente para destruir la correspondencia de frecuencias: la misma letra se cifra distinto según su posición."},{"id":"6a8f86280f","t":1,"q":"El texto \"PLAN\" cifrado con la clave \"SOL\" da \"IZLF\". ¿Qué tipo de cifrado es?","c":"Sustitución polialfabética (Vigenère).","d":["Sustitución monoalfabética (César).","Transposición (escítala).","Función hash."],"f":[],"cf":false,"e":"Vigenère aplica una clave repetida sobre el texto: cada letra se desplaza según la letra de la clave que le toca."},{"id":"8ab4eed0ab","t":1,"q":"¿Quiénes introdujeron el concepto de criptografía de clave pública?","c":"Diffie y Hellman, en 1976.","d":["Rivest, Shamir y Adleman, en 1977.","Claude Shannon, en 1949.","IBM, al desarrollar DES."],"f":[],"cf":false,"e":"Diffie y Hellman publicaron \"New directions in Cryptography\" (1976). RSA es de 1977 y fue el primer algoritmo que la implementó en forma práctica."},{"id":"9ff309cd18","t":1,"q":"Según el material, ¿cuál es el principal inconveniente de la criptografía simétrica?","c":"Distribuir la clave de forma segura entre emisor y receptor.","d":["Su lentitud, que la vuelve poco práctica para cifrar grandes volúmenes de datos.","Que necesita claves mucho más largas que la asimétrica.","Que no puede garantizar la confidencialidad del mensaje."],"f":[],"cf":false,"e":"La simétrica es rápida y usa claves más cortas; su problema es la distribución de la clave. Lentitud y claves largas son desventajas de la asimétrica."},{"id":"0c098f8688","t":1,"q":"Sobre AES, ¿cuál de estas afirmaciones es INCORRECTA?","c":"Es un cifrado de flujo.","d":["Fue especificado por el NIST.","Cifra en bloques aplicando varias rondas de cifrado.","Usa la misma clave para cifrar y descifrar."],"f":[],"cf":false,"e":"AES cifra en bloques. El cifrado de flujo del material es RC4."},{"id":"bfb215b737","t":1,"q":"¿Cuál de estos algoritmos simétricos cifra en flujo y no en bloques?","c":"RC4","d":["DES","3DES","AES"],"f":[],"cf":false,"e":"RC4 es el cifrado de flujo; DES, 3DES y AES son de bloque."},{"id":"15f3d3b196","t":1,"q":"DES cifra la información en bloques de:","c":"64 bits.","d":["128 bits.","256 bits.","1024 bits."],"f":[],"cf":false,"e":"DES (años 70) trabaja con bloques de 64 bits."},{"id":"d53d28196d","t":1,"q":"¿Cuáles son algoritmos asimétricos?","c":"RSA y DSA.","d":["AES y RSA.","3DES y DSA.","RC4 y ECC."],"f":[],"cf":false,"e":"Simétricos: AES, DES, 3DES, RC4. Asimétricos: RSA, DSA (y ECC). Cada distractor mezcla uno de cada grupo."},{"id":"3f2b576dee","t":1,"q":"La seguridad de RSA se basa en:","c":"La dificultad de factorizar el producto de dos primos grandes.","d":["La imposibilidad de invertir una función hash.","Que la clave pública se mantiene en secreto entre emisor y receptor.","La cantidad de rondas de cifrado que aplica sobre cada bloque."],"f":[],"cf":false,"e":"RSA depende de la factorización. Las rondas son de AES y la clave pública justamente no es secreta."},{"id":"77a10e5301","t":1,"q":"En RSA, la clave pública está formada por:","c":"(e, n)","d":["(d, n)","(p, q)","(e, d)"],"f":[],"cf":false,"e":"Pública = (e, n); privada = (d, n). p y q son los primos que deben mantenerse secretos."},{"id":"4dc0fb6147","t":1,"q":"Bruno quiere enviarle a Ana un mensaje que solo Ana pueda leer. ¿Con qué clave cifra Bruno?","c":"Con la clave pública de Ana.","d":["Con la clave privada de Bruno.","Con la clave privada de Ana.","Con la clave pública de Bruno."],"f":[],"cf":false,"e":"Para confidencialidad se cifra con la pública del receptor y se descifra con la privada del receptor. Bruno nunca tiene la privada de Ana."},{"id":"d413b857c3","t":1,"q":"Ana firma digitalmente un contrato y se lo envía a Bruno. ¿Con qué clave verifica Bruno la firma?","c":"Con la clave pública de Ana.","d":["Con la clave privada de Ana.","Con la clave pública de Bruno.","Con la clave de sesión simétrica."],"f":[],"cf":false,"e":"Se firma con la privada del emisor y se verifica con la pública del emisor. Es el uso inverso al del cifrado para confidencialidad."},{"id":"bb07d2cfa1","t":1,"q":"¿Qué garantiza la firma digital?","c":"Todas las anteriores.","d":["Autenticación del origen.","Integridad del mensaje.","No repudio en origen."],"f":["Todas las anteriores."],"cf":true,"e":"La firma digital garantiza las tres. Lo que NO garantiza por sí sola es la confidencialidad."},{"id":"0e2dc976df","t":1,"q":"¿Qué NO garantiza la firma digital por sí sola?","c":"Confidencialidad.","d":["Que el mensaje no fue alterado en el camino.","Que el emisor no pueda negar haberlo enviado.","Que el mensaje proviene de quien dice enviarlo."],"f":[],"cf":false,"e":"El mensaje firmado puede viajar sin cifrar: cualquiera lo puede leer."},{"id":"510904833f","t":1,"q":"En el proceso de firma digital, lo que se cifra con la clave privada del emisor es:","c":"El hash (resumen) del mensaje.","d":["El mensaje completo, para que nadie pueda leerlo.","La clave pública del receptor.","La clave de sesión simétrica."],"f":[],"cf":false,"e":"Se firma el resumen porque el mensaje puede ser muy largo. Firmar no busca ocultar el contenido."},{"id":"aeb1bcec10","t":1,"q":"Según el material, ¿qué longitudes de clave se consideran seguras?","c":"128 bits para simétrica y al menos 1024 bits para RSA.","d":["1024 bits para simétrica y 128 bits para RSA.","La misma longitud para ambas, porque la seguridad depende solo del algoritmo.","64 bits para simétrica y 512 bits para RSA."],"f":[],"cf":false,"e":"La asimétrica necesita claves más largas para una seguridad comparable."},{"id":"4bf0431a3b","t":1,"q":"¿Cuál NO es una desventaja de la criptografía asimétrica según el material?","c":"La dificultad para distribuir las claves.","d":["Es más lenta que la simétrica.","Usa claves más grandes.","No es inmune a ataques de intermediario."],"f":[],"cf":false,"e":"La asimétrica resuelve el problema de distribución: la pública se comparte abiertamente. Ese problema es de la simétrica."},{"id":"27a6cdf98a","t":1,"q":"En un sistema de cifrado híbrido, la criptografía asimétrica se usa principalmente para:","c":"Cifrar la clave de sesión simétrica.","d":["Cifrar el mensaje completo, porque es más segura que la simétrica.","Calcular el hash que garantiza la integridad.","Comprimir el mensaje antes de enviarlo por un canal inseguro."],"f":[],"cf":false,"e":"La asimétrica es costosa, por eso solo protege la clave; los datos se cifran con la simétrica, que es rápida."},{"id":"fb1d8bd92e","t":1,"q":"En el esquema híbrido explicado en la Práctica, ¿qué elementos envía el emisor al receptor?","c":"Texto cifrado, firma digital y clave de sesión cifrada.","d":["Texto plano, Hash A y clave privada del emisor.","Texto cifrado, clave de sesión sin cifrar y firma digital.","Texto cifrado, Hash B y clave pública del receptor."],"f":[],"cf":false,"e":"La clave de sesión nunca viaja en claro: va cifrada con la pública del receptor. El Hash B lo calcula el receptor."},{"id":"6e00c78a8e","t":1,"q":"En el esquema híbrido, el receptor descifra la firma con la clave pública del emisor y la operación funciona. Con ese paso solo, ¿qué quedó demostrado?","c":"La autenticidad del emisor, pero todavía no la integridad del mensaje.","d":["La autenticidad del emisor y también la integridad, porque la firma contiene el hash.","La integridad del mensaje, pero no la autenticidad del emisor.","La confidencialidad del mensaje."],"f":[],"cf":false,"e":"La integridad recién se comprueba cuando el receptor calcula el Hash B y lo compara con el Hash A."},{"id":"18efeabb4f","t":1,"q":"En el esquema híbrido, ¿con qué clave obtiene el receptor la clave de sesión?","c":"Con su propia clave privada RSA.","d":["Con la clave pública del emisor.","Con su propia clave pública RSA.","Con el Hash A recibido."],"f":[],"cf":false,"e":"La clave de sesión fue cifrada con la pública del receptor, así que solo su privada la abre."},{"id":"957b05ee3a","t":1,"q":"En un ataque de ransomware con cifrado híbrido, la clave AES de cada sesión se cifra con:","c":"La clave pública RSA del atacante.","d":["La clave privada RSA del atacante.","La clave pública RSA de la víctima.","La misma clave AES, aplicada dos veces."],"f":[],"cf":false,"e":"Así solo el atacante, con su privada, puede recuperar la clave AES. Por eso exige el rescate."},{"id":"73b3430821","t":1,"q":"Sobre las funciones hash, ¿cuál afirmación es FALSA?","c":"Con la clave adecuada, el hash se puede revertir al mensaje.","d":["El resumen tiene longitud fija, sin importar el largo del mensaje.","Debe ser difícil encontrar dos mensajes con el mismo resumen.","MD5 y SHA-1 son ejemplos de funciones hash."],"f":[],"cf":false,"e":"El hash es unidireccional y no usa clave: no se \"descifra\". Esa es la diferencia con el cifrado."},{"id":"686641a43d","t":1,"q":"Un certificado digital:","c":"Es emitido y firmado por una Autoridad Certificadora y tiene fecha de expiración.","d":["Lo genera el propio titular y no vence mientras no se revoque la clave.","Contiene la clave privada del titular para que terceros puedan verificar sus firmas.","Solo se usa en la banca online y no en la navegación web."],"f":[],"cf":false,"e":"La CA lo firma y tiene validez limitada. Nunca contiene la clave privada. Se usa también en SSL/TLS, trámites y firma de software."},{"id":"9533c5b851","t":2,"q":"La capa de Aplicación del modelo TCP/IP equivale, en el modelo OSI, a:","c":"Las capas de Aplicación, Presentación y Sesión.","d":["Solo la capa de Aplicación.","Las capas de Aplicación y Presentación.","Las capas de Aplicación, Presentación, Sesión y Transporte."],"f":[],"cf":false,"e":"TCP/IP compacta las tres capas superiores de OSI en Aplicación. Transporte se mantiene como capa propia."},{"id":"d2e960615c","t":2,"q":"¿En qué capa del modelo TCP/IP se ubica ARP según el material?","c":"Acceso a la red.","d":["Internet, junto con IP e ICMP.","Transporte.","Aplicación."],"f":[],"cf":false,"e":"ARP traduce direcciones lógicas a físicas y trabaja en la capa de enlace, que en TCP/IP forma parte de Acceso a la red. La trampa es ponerlo en Internet porque maneja IPs."},{"id":"0ed6237bad","t":2,"q":"Que IP sea \"no orientado a conexión\" significa que:","c":"Se envían sin acuerdo previo y los paquetes pueden tomar rutas distintas.","d":["Se establece una sesión con el destino antes de enviar cualquier paquete.","Los paquetes siempre siguen la misma ruta para llegar en orden.","El protocolo confirma la recepción de cada paquete."],"f":[],"cf":false,"e":"IP es de \"mejor esfuerzo\": no pacta nada ni confirma entregas. La fiabilidad la agrega TCP."},{"id":"58adf4b190","t":2,"q":"El checksum del protocolo IP protege:","c":"Solo la cabecera del paquete.","d":["La cabecera y los datos transmitidos.","Solo los datos transmitidos.","Nada: IP no utiliza checksums."],"f":[],"cf":false,"e":"Según el material, IP verifica con checksum sus cabeceras, no los datos."},{"id":"dbf7965a10","t":2,"q":"Un administrador asigna la dirección 192.168.2.100 a una PC. Después, el router aprende por un protocolo dinámico cómo llegar a la red 192.168.2.0. Estas dos acciones corresponden, en orden, a:","c":"Direccionamiento y enrutamiento.","d":["Enrutamiento y direccionamiento.","Direccionamiento en ambos casos.","Enrutamiento en ambos casos."],"f":[],"cf":false,"e":"Direccionamiento es la etiqueta que identifica al equipo; enrutamiento es aprender cómo llegar hasta él (tabla de enrutamiento)."},{"id":"140a9b4708","t":2,"q":"¿Qué máscara corresponde a un /26?","c":"255.255.255.192","d":["255.255.255.128","255.255.255.224","255.255.255.240"],"f":[],"cf":false,"e":"/26 = 24 bits + 2 bits (128 + 64 = 192). /25 = .128, /27 = .224, /28 = .240."},{"id":"cb63642261","t":2,"q":"La función principal de la máscara de red es:","c":"Indicar qué parte de la IP es red y qué parte es host.","d":["Indicar al tráfico por dónde debe salir hacia otras redes.","Traducir la dirección IP a la dirección física del dispositivo.","Identificar al fabricante de la placa de red."],"f":[],"cf":false,"e":"La salida es el gateway, la traducción IP a MAC es ARP y el fabricante se ve en la MAC."},{"id":"964e890458","t":2,"q":"¿Cuál de estas direcciones es privada?","c":"Ninguna de las anteriores.","d":["172.32.10.5","192.169.1.1","11.0.0.1"],"f":["Ninguna de las anteriores."],"cf":true,"e":"Privadas: 10.0.0.0/8, 172.16 a 172.31 y 192.168.x.x. 172.32 se pasa del rango, 192.169 no es 192.168 y 11.x no es 10.x."},{"id":"de02b21d24","t":2,"q":"La dirección 127.0.0.1:","c":"Pertenece al rango reservado para loopback.","d":["Es una dirección privada de clase A asignable a equipos de la LAN.","Es una dirección de clase D usada para multicast.","Es una dirección pública de clase A."],"f":[],"cf":false,"e":"Aunque cae en el rango de clase A, 127.x está reservado para loopback."},{"id":"d3b7ef5fa1","t":2,"q":"¿Cuál es la abreviatura correcta de FE00:0000:0000:0001:0000:0000:0021:0234?","c":"FE00:0:0:1::21:234","d":["FE00::1::21:234","FE:0:0:1::21:234","FE00:0:0:1:21:234"],"f":[],"cf":false,"e":"El \"::\" se usa una sola vez; solo se quitan ceros a la izquierda (FE00 no puede quedar FE); y tienen que quedar 8 grupos."},{"id":"6088b1d830","t":2,"q":"En IPv6, los primeros 64 bits de la dirección identifican:","c":"La red (global prefix), y los últimos 16 de esos bits se usan para subnet.","d":["El host (interface ID), mientras que los últimos 64 identifican la red y la subred.","El fabricante del dispositivo.","La máscara de red."],"f":[],"cf":false,"e":"IPv6 tiene 128 bits: 64 de red y 64 de host."},{"id":"dcff542609","t":2,"q":"El número 168 en binario es:","c":"10101000","d":["10100100","11001000","10101010"],"f":[],"cf":false,"e":"128 + 32 + 8 = 168."},{"id":"cf14c80603","t":2,"q":"Una PC tiene IP 192.168.0.128/24 y gateway 192.168.0.1. Si envía un paquete a 192.168.0.50:","c":"Lo entrega directamente en la red local, sin pasar por el gateway.","d":["Lo envía al gateway, porque todo paquete sale por la puerta de enlace.","Lo descarta, porque la dirección de destino es menor que la propia.","Le pide al servidor DHCP la ruta hacia ese destino."],"f":[],"cf":false,"e":"El destino está dentro de su máscara. El gateway solo se usa para destinos fuera de la red local."},{"id":"8bcf29214a","t":2,"q":"Según la Práctica, una videollamada usa UDP y no TCP porque:","c":"Prioriza la velocidad: si se pierden paquetes, se descartan.","d":["UDP garantiza con un checksum que todos los paquetes lleguen.","UDP es orientado a conexión y mantiene la sesión estable.","UDP cifra el tráfico de video y TCP no."],"f":[],"cf":false,"e":"TCP asegura la llegada (datos, navegación); UDP manda lo más rápido posible (video, voz, DNS)."},{"id":"e1405af1fc","t":2,"q":"Una dirección IPv4 tiene:","c":"32 bits divididos en 4 octetos.","d":["64 bits divididos en 8 octetos.","128 bits divididos en 8 grupos.","48 bits divididos en 6 octetos."],"f":[],"cf":false,"e":"IPv4 = 32 bits. 128 bits es IPv6 y 48 bits es la MAC."},{"id":"3bfcfb28c5","t":3,"q":"¿De qué clase es la dirección 130.10.5.1?","c":"Clase B.","d":["Clase A.","Clase C.","Clase D."],"f":[],"cf":false,"e":"Se mira solo el primer número: 128 a 191 es clase B."},{"id":"e1c44e76b8","t":3,"q":"¿Qué rango del primer número corresponde a la clase C?","c":"192 a 223.","d":["128 a 191.","224 a 239.","0 a 127."],"f":[],"cf":false,"e":"A: 0 a 127; B: 128 a 191; C: 192 a 223; D: 224 a 239; E: 240 a 255."},{"id":"8e44cfecd6","t":3,"q":"Las direcciones de clase D (224 a 239) se usan para:","c":"Multicast.","d":["Investigación.","Loopback.","Redes privadas pequeñas."],"f":[],"cf":false,"e":"La clase E es la reservada para investigación y 127.x es loopback."},{"id":"beb48b7b26","t":3,"q":"Según el material, ¿cuántos hosts admite una red de clase B?","c":"65.534","d":["254","16.777.214","65.536"],"f":[],"cf":false,"e":"Son 16 bits de host: 65.536 combinaciones menos la dirección de red y la de broadcast. 254 es clase C y 16.777.214 es clase A."},{"id":"d64134eda0","t":3,"q":"¿Qué máscara corresponde por defecto a la clase A?","c":"255.0.0.0 (/8)","d":["255.255.0.0 (/16)","255.255.255.0 (/24)","0.255.255.255"],"f":[],"cf":false,"e":"0.255.255.255 sería la wildcard, no la máscara."},{"id":"2ea386087e","t":3,"q":"La dirección 200.45.1.1 es de clase C. Entonces:","c":"Puede ser pública: clase y privada/pública son cosas distintas.","d":["Es privada, porque todas las direcciones de clase C están reservadas para redes LAN.","Es una dirección de loopback.","Es inválida, porque la clase C termina en 199."],"f":[],"cf":false,"e":"Solo 192.168.x.x es privada dentro de la clase C."},{"id":"8fc21e4f2d","t":3,"q":"Se divide 192.168.1.0/24 en 4 subredes iguales. ¿Qué máscara se usa?","c":"/26 (255.255.255.192)","d":["/25 (255.255.255.128)","/28 (255.255.255.240)","/24, porque la máscara no cambia"],"f":[],"cf":false,"e":"(Complemento, no está en los apuntes) 4 subredes = 2 bits robados al host: 24 + 2 = /26, bloques de 64."},{"id":"7001d2c47b","t":3,"q":"Con máscara /26, ¿están en la misma red 192.168.1.70 y 192.168.1.130?","c":"No: quedan en bloques distintos de 64.","d":["Sí, porque comparten los tres primeros números.","Sí, porque las dos son privadas de clase C.","No, porque /26 solo admite direcciones hasta el .63."],"f":[],"cf":false,"e":"(Complemento) Bloques de /26: 0 a 63, 64 a 127, 128 a 191 y 192 a 255. El 70 y el 130 caen en bloques distintos."},{"id":"30ec9ec4e1","t":3,"q":"¿Cuántos equipos (hosts útiles) entran en una subred /27?","c":"30","d":["32","62","14"],"f":[],"cf":false,"e":"(Complemento) Bloque de 256 - 224 = 32 direcciones, menos la de red y la de broadcast."},{"id":"93e8f82b07","t":3,"q":"Con máscara /25, ¿cuál es la red de la dirección 192.168.1.130?","c":"192.168.1.128","d":["192.168.1.0","192.168.1.130","192.168.1.255"],"f":[],"cf":false,"e":"(Complemento) /25 parte el último número en 0 a 127 y 128 a 255; 130 cae en la segunda mitad."},{"id":"ffbd6e29d3","t":3,"q":"¿Cuál es el tamaño de bloque de la máscara 255.255.255.240?","c":"16","d":["240","15","32"],"f":[],"cf":false,"e":"(Complemento) Tamaño de bloque = 256 menos el último número de la máscara: 256 - 240 = 16."},{"id":"e01ebe64f2","t":4,"q":"Una empresa separa Administración e Invitados configurando VLAN 10 y VLAN 20 en el mismo switch. Es un ejemplo de segmentación:","c":"Lógica.","d":["Física.","Perimetral (DMZ).","Ninguna: no hay segmentación porque comparten el mismo switch."],"f":[],"cf":false,"e":"Según la Práctica, la segmentación lógica son VLANs (una por área); la física es separar con switches distintos conectados a un router."},{"id":"97b0a96b59","t":4,"q":"Según la Práctica, un ejemplo de segmentación física es:","c":"Un switch por grupo de PCs, conectado a un router.","d":["Crear una VLAN por área sobre el mismo switch.","Dividir una red /24 en subredes /26 en el mismo equipo.","Aplicar una ACL distinta en cada subinterfaz del router."],"f":[],"cf":false,"e":"Física implica equipamiento separado. Las otras opciones dividen por configuración."},{"id":"a9ae930d7c","t":4,"q":"¿Cuál NO es un beneficio de la segmentación de red según el material?","c":"Elimina la necesidad de controles de acceso entre segmentos.","d":["Reduce la superficie de ataque y limita la propagación de un ataque.","Mejora el rendimiento al reducir la congestión.","Ayuda a cumplir normativas como PCI-DSS o GDPR."],"f":[],"cf":false,"e":"Los segmentos se comunican \"bajo ciertas condiciones\": justamente se controlan con ACLs y firewalls."},{"id":"20db969cfc","t":4,"q":"Dos PCs conectadas al mismo switch, una en la VLAN 10 y otra en la VLAN 20, necesitan comunicarse. ¿Qué hace falta?","c":"Un router (capa 3), por ejemplo con subinterfaces.","d":["Nada, porque comparten el mismo switch físico.","Configurar ambos puertos del switch en modo access.","Conectar las dos PCs entre sí con un cable cruzado."],"f":[],"cf":false,"e":"VLANs distintas son redes distintas; el switch (capa 2) no cruza de una a otra."},{"id":"5789864448","t":4,"q":"En un esquema router-on-a-stick, el puerto del switch que se conecta al router se configura como:","c":"Trunk.","d":["Access.","Shutdown.","VTY."],"f":[],"cf":false,"e":"El troncal transporta varias VLANs por un único cable. Access es para las PCs."},{"id":"961c42fe22","t":4,"q":"¿Qué hace el estándar IEEE 802.1Q (dot1Q)?","c":"Etiqueta cada trama con el número de VLAN.","d":["Cifra el tráfico que viaja entre VLANs distintas.","Asigna direcciones IP automáticamente a cada VLAN.","Traduce las IP privadas de las VLANs a una IP pública."],"f":[],"cf":false,"e":"El switch agrega la etiqueta y el router la lee para derivar el paquete a la subinterfaz correcta. Cifrar no es su función."},{"id":"65f517d42d","t":4,"q":"Una empresa capacita al personal, instala control biométrico en el datacenter, actualiza todos los sistemas y usa antivirus corporativo, pero mantiene toda la red plana, sin segmentar. ¿Qué tipo de vulnerabilidad persiste?","c":"De red.","d":["Humana.","Física.","De software."],"f":[],"cf":false,"e":"Capacitación cubre la humana, biometría la física, parches y antivirus la de software. La red plana queda expuesta."},{"id":"4776435595","t":4,"q":"En router-on-a-stick, cada subinterfaz del router (por ejemplo G0/1.10):","c":"Actúa como gateway de su VLAN y puede tener su propia ACL.","d":["Necesita un cable físico propio hacia el switch.","No lleva dirección IP, porque la IP se configura solo en la interfaz física.","Se configura en modo access para recibir una sola VLAN."],"f":[],"cf":false,"e":"La interfaz física se enciende sin IP; cada subinterfaz lleva encapsulation dot1Q y la IP del gateway."},{"id":"8c38113298","t":5,"q":"Un firewall configurado para que \"todo lo que no está explícitamente permitido sea negado\" aplica una política:","c":"Restrictiva.","d":["Permisiva.","Stateful.","Allow by default."],"f":[],"cf":false,"e":"Restrictiva = deny by default (la recomendada). Stateful es un tipo de firewall, no una política."},{"id":"5e4a70ef93","t":5,"q":"¿Cuál es la principal limitación del firewall de filtrado de paquetes?","c":"No inspecciona el contenido de los paquetes.","d":["Introduce latencia, porque se conecta a los servidores en nombre del usuario.","Decide en función del estado de las conexiones, lo que consume muchos recursos.","Solo protege al equipo en el que está instalado."],"f":[],"cf":false,"e":"Filtra por IP, puerto y protocolo. La latencia es del proxy, el estado es del stateful y proteger un solo equipo es del personal."},{"id":"b5619961a4","t":5,"q":"En un tipo de firewall, el usuario no se conecta directamente al servidor externo: el firewall realiza la conexión en su nombre. ¿Cuál es?","c":"De aplicación o proxy.","d":["De filtrado de paquetes.","De inspección de estado.","Personal."],"f":[],"cf":false,"e":"El proxy es intermediario y puede inspeccionar a nivel de aplicación, a costa de latencia."},{"id":"cf3dfa21de","t":5,"q":"Un firewall de próxima generación (NGFW) se caracteriza por:","c":"Sumar al firewall tradicional DPI, IPS y control de aplicaciones.","d":["Reemplazar al antivirus en cada equipo de la red.","Filtrar únicamente por dirección IP y puerto, pero a mayor velocidad.","Funcionar como honeypot para atraer atacantes."],"f":[],"cf":false,"e":"Su ventaja es la protección integral; su limitación, costo y hardware potente."},{"id":"668f587565","t":5,"q":"Según el apunte, ¿contra cuál de estas situaciones NO puede proteger un firewall?","c":"Un empleado que copia datos confidenciales a un pendrive.","d":["Un escaneo de puertos lanzado desde Internet.","Intentos de acceso no autorizado a servidores internos.","Tráfico dirigido a puertos que la política no permite."],"f":[],"cf":false,"e":"El firewall no protege contra traidores o usuarios inconscientes, ingeniería social, virus en archivos ni conexiones que no pasan por él."},{"id":"cde3db8f01","t":5,"q":"Un firewall dual-homed es aquel que:","c":"Tiene dos interfaces: una hacia la red pública y otra hacia la privada.","d":["Se compone de dos firewalls conectados en serie, uno externo y otro interno.","Aplica a la vez una política restrictiva y otra permisiva.","Está instalado en dos hosts para tener redundancia."],"f":[],"cf":false,"e":"Dual = dos interfaces. Multi-homed = varias interfaces hacia varias redes con políticas distintas."},{"id":"31596f3a49","t":5,"q":"¿Cuál afirmación sobre firewalls de hardware y software es correcta?","c":"El de software solo protege al equipo en el que está instalado.","d":["El de hardware consume recursos de cada PC de la red.","El de software protege a toda la red local si se instala en una sola PC.","Es mejor elegir uno de los dos, porque combinarlos genera conflictos."],"f":[],"cf":false,"e":"El hardware protege toda la red sin consumir recursos del PC. El apunte recomienda usar ambos."},{"id":"49cfb00940","t":5,"q":"Según el material, los servicios que ofrece un firewall para proteger la red son:","c":"ACL, NAT y VPN.","d":["Antivirus, backup y DHCP.","IDS, honeypot y DNS.","Cifrado de discos, MFA y antivirus."],"f":[],"cf":false,"e":"El \"cómo proteger\" del material son los servicios del firewall: ACLs, NAT y VPN."},{"id":"4f6262674b","t":5,"q":"Un atacante inserta registros falsos en una base de datos. Según la clasificación de ataques por efecto, se trata de:","c":"Fabricación.","d":["Modificación.","Intercepción.","Interrupción."],"f":[],"cf":false,"e":"Fabricación = insertar objetos falsificados. Modificación = manipular información que ya existe."},{"id":"57d89f939c","t":5,"q":"Un atacante logra leer los correos de un gerente sin alterarlos. Según la clasificación por efecto, es:","c":"Intercepción.","d":["Modificación.","Fabricación.","Interrupción."],"f":[],"cf":false,"e":"Intercepción = acceso no autorizado a un recurso. No hubo cambio de datos ni corte del servicio."},{"id":"e58cd842c7","t":5,"q":"En iptables, la tabla que se usa por defecto es:","c":"filter","d":["nat","mangle","INPUT"],"f":[],"cf":false,"e":"INPUT es una cadena (chain) de la tabla filter, no una tabla."},{"id":"e7de069dc1","t":5,"q":"Según el apunte del Firewall de Windows, agregar una excepción para un programa es preferible a abrir un puerto porque:","c":"El puerto solo queda abierto mientras el programa espera la conexión.","d":["Las excepciones cifran automáticamente la conexión del programa.","Un puerto abierto desactiva el firewall para todos los programas.","Las excepciones también escanean el programa en busca de virus."],"f":[],"cf":false,"e":"Además es más fácil y no hace falta saber qué puerto usa el programa."},{"id":"9052fa735c","t":6,"q":"Una ACL estándar filtra el tráfico según:","c":"Solo la dirección IP de origen.","d":["Las direcciones IP de origen y destino.","Origen, destino, protocolo y puerto.","El protocolo y el número de puerto."],"f":[],"cf":false,"e":"La extendida es la que analiza origen, destino, protocolo y puerto."},{"id":"0a2d5a5e38","t":6,"q":"La lista access-list 150 corresponde a una ACL:","c":"Extendida.","d":["Estándar.","Inválida, porque el máximo permitido es 99.","Estándar para IPv6."],"f":[],"cf":false,"e":"Estándar: 1 a 99. Extendida: 100 a 199."},{"id":"b26e5a2e21","t":6,"q":"Según la regla de ubicación que dan los apuntes, ¿dónde se coloca una ACL extendida?","c":"Lo más cerca posible del origen.","d":["Lo más cerca posible del destino.","En cualquier interfaz, porque la ubicación no afecta el resultado.","Siempre en la interfaz de salida hacia Internet."],"f":[],"cf":false,"e":"La extendida descarta el tráfico no deseado apenas sale y no satura enlaces. La estándar, que solo ve el origen, va cerca del destino."},{"id":"3fdabbd051","t":6,"q":"¿Por qué una ACL estándar se coloca cerca del destino?","c":"Porque solo mira el origen y cerca de él bloquearía tráfico legítimo.","d":["Porque las ACL estándar solo pueden aplicarse en dirección out.","Porque cerca del origen el router todavía no puede leer la dirección IP de origen del paquete.","Porque así se evita el deny implícito."],"f":[],"cf":false,"e":"Al no mirar el destino, si se pone cerca del origen corta todo lo que sale de ese host o red."},{"id":"9521930351","t":6,"q":"Se crea access-list 10 permit host 192.168.10.10 y se aplica a una interfaz. ¿Qué pasa con el tráfico de 192.168.10.20?","c":"Se bloquea por el deny implícito.","d":["Pasa, porque no hay ninguna línea deny que lo mencione.","Pasa solo si es tráfico ICMP.","Se bloquea únicamente si la ACL se aplica en dirección in."],"f":[],"cf":false,"e":"Toda ACL termina con un deny any implícito: lo que no coincide con ninguna línea se descarta."},{"id":"22c21cd958","t":6,"q":"Una ACL tiene estas líneas, en este orden:\n`access-list 101 permit ip 20.20.20.0 0.0.0.255 30.30.30.0 0.0.0.255`\n`access-list 101 deny ip host 20.20.20.5 30.30.30.0 0.0.0.255`\n¿Qué ocurre con un paquete de 20.20.20.5 hacia 30.30.30.10?","c":"Se permite.","d":["Se bloquea, porque la línea deny es más específica y tiene prioridad.","Se bloquea, porque un deny siempre prevalece sobre un permit.","Se descarta por el deny implícito."],"f":[],"cf":false,"e":"First match: el router lee de arriba hacia abajo y se detiene en la primera coincidencia (el permit de la red). Por eso las excepciones van antes de la regla general."},{"id":"92bd27385b","t":6,"q":"En una ACL, la expresión 192.168.1.0 0.0.0.255 abarca:","c":"Toda la red 192.168.1.0/24.","d":["Solo el host 192.168.1.0.","Solo el host 192.168.1.255.","Toda la red 192.168.0.0/16."],"f":[],"cf":false,"e":"0.0.0.255 es la wildcard de una /24."},{"id":"019cf1b911","t":6,"q":"¿Cuál es la wildcard de una red /30?","c":"0.0.0.3","d":["255.255.255.252","0.0.0.252","0.0.0.4"],"f":[],"cf":false,"e":"La wildcard es la máscara invertida: 255.255.255.255 menos 255.255.255.252 da 0.0.0.3. 255.255.255.252 es la máscara, no la wildcard."},{"id":"783aba11d5","t":6,"q":"¿Cuál de estas expresiones es equivalente a `host 10.10.10.10` en una ACL?","c":"10.10.10.10 0.0.0.0","d":["10.10.10.10 255.255.255.255","10.10.10.10 0.0.0.255","10.10.10.10 255.255.255.0"],"f":[],"cf":false,"e":"Un solo equipo = wildcard 0.0.0.0. Las opciones con 255 confunden la wildcard con la máscara."},{"id":"6947574fdf","t":6,"q":"Según los apuntes, ¿dónde se usa la wildcard en lugar de la máscara de red?","c":"En las ACL y en el comando network de OSPF.","d":["En la configuración IP de las PCs y en las interfaces del router.","En las ACL y en el comando ip address de las subinterfaces.","Solo en direcciones IPv6."],"f":[],"cf":false,"e":"ip address lleva máscara (ej. 255.255.255.0). La wildcard aparece en ACL y OSPF."},{"id":"f74d224cf8","t":6,"q":"La wildcard se define como:","c":"La máscara de red invertida.","d":["La máscara de red escrita en formato hexadecimal.","La dirección de broadcast de la red.","La máscara que identifica al host dentro de una VLAN."],"f":[],"cf":false,"e":"La Práctica la define como la máscara de subred escrita al revés (ej. /24 = 0.0.0.255)."},{"id":"1643cd8f94","t":6,"q":"Se aplica `access-list 100 permit tcp host 192.168.10.20 host 192.168.20.10 eq 443` en la entrada de la interfaz de la red 10. Desde 192.168.10.20 se hace ping al servidor. ¿Qué pasa?","c":"Falla, porque ICMP no está permitido y rige el deny implícito.","d":["Funciona, porque ping no usa puertos y la ACL filtra por puerto.","Funciona, porque la ACL solo filtra tráfico TCP.","Falla, porque el puerto 443 está cerrado en el servidor."],"f":[],"cf":false,"e":"La única línea permite TCP 443. Todo lo demás, incluido ICMP, cae en el deny implícito."},{"id":"dfd9c44c7a","t":6,"q":"Según el material, las ACL filtran:","c":"El tráfico que atraviesa el router, no el originado en él.","d":["Todo el tráfico, incluido el que genera el propio router.","Solo el tráfico generado por el router.","Solo el tráfico que entra desde Internet."],"f":[],"cf":false,"e":"Es uno de los tips del apunte."},{"id":"3d65cfee5d","t":6,"q":"Toda ACL debe contener, como mínimo, una línea:","c":"Permit.","d":["Deny.","Deny any.","Con la palabra any."],"f":[],"cf":false,"e":"El deny ya está implícito al final. Sin ningún permit, la ACL bloquea todo."},{"id":"9dd7a21dd6","t":6,"q":"Se configura:\n`access-list 10 deny 192.168.1.0 0.0.0.255`\n`access-list 10 permit any`\n¿Qué riesgo señala el material sobre esta configuración?","c":"El permit any puede dejar pasar redes que no conocemos.","d":["El deny implícito bloquea todo, incluso lo permitido por la segunda línea.","La wildcard 0.0.0.255 bloquea solo el host 192.168.1.0.","Las ACL estándar no admiten líneas deny."],"f":[],"cf":false,"e":"La ACL funciona, pero permitir \"cualquier cosa\" es una posible incidencia de seguridad."},{"id":"fb690fbae4","t":6,"q":"Se quiere que la red 10.10.20.0/24 acceda al servidor 10.10.30.100 y que la red 10.10.10.0/24 no. ¿Qué es suficiente?","c":"Solo el permit para la red 10.10.20.0, porque la otra queda bloqueada por el deny implícito.","d":["El permit para la red 10.10.20.0 y, obligatoriamente, un deny explícito para la red 10.10.10.0.","Un deny para la red 10.10.10.0 seguido de un permit any.","Un permit any, porque el servidor ya filtra el resto."],"f":[],"cf":false,"e":"La Práctica lo marca: el deny de la red 10.10.10.0 \"está de más\" por el deny implícito."},{"id":"e299e03805","t":6,"q":"El comando `ip access-group 100 in` aplicado en la interfaz G0/0/0 filtra:","c":"El tráfico que entra al router por G0/0/0.","d":["El tráfico que sale del router por G0/0/0.","El tráfico que entra al router por cualquier interfaz.","El tráfico que genera el propio router."],"f":[],"cf":false,"e":"in y out se evalúan desde el punto de vista de la interfaz donde se aplica la ACL."},{"id":"e714fab444","t":6,"q":"En el escenario de Packet Tracer, la ACL estándar que deja pasar solo a PC Mateo hacia la red de Sistemas se aplica con `ip access-group 10 out` en la interfaz de Sistemas. ¿Por qué ahí?","c":"Porque es la interfaz más cercana al destino.","d":["Porque las ACL estándar solo pueden aplicarse en dirección out.","Porque es la interfaz más cercana al origen del tráfico.","Porque en la interfaz de entrada no se puede aplicar una ACL numerada."],"f":[],"cf":false,"e":"Es la regla de ubicación de la estándar: cerca del destino."},{"id":"868bc929d1","t":6,"q":"Las líneas de una ACL deben ordenarse:","c":"De lo más específico a lo más general.","d":["De lo más general a lo más específico.","Primero todos los permit y después todos los deny.","El orden no importa, porque el router evalúa todas las líneas."],"f":[],"cf":false,"e":"Las excepciones tienen que estar antes de la regla general, por el first match."},{"id":"2f84c0e766","t":7,"q":"Un dispositivo detecta un ataque, registra la IP de origen, envía una trampa SNMP y un correo al administrador, pero el paquete malicioso llega igual a destino. Es un:","c":"IDS.","d":["IPS.","Honeypot.","NGFW."],"f":[],"cf":false,"e":"El IDS detecta y alerta; no bloquea por sí mismo. El IPS descarta el tráfico."},{"id":"6ba15c2597","t":7,"q":"¿Qué característica diferencia al IPS del IDS según el material?","c":"Analiza en tiempo real y tiene un puerto de entrada y otro de salida.","d":["Trabaja en modo promiscuo y no tiene dirección IP.","Se instala como software sobre el sistema operativo del host.","Solo registra los ataques y los paquetes sospechosos para un análisis forense posterior."],"f":[],"cf":false,"e":"El IPS está en línea con el tráfico. El modo promiscuo sin IP es del NIDS y el software en el host es el HIDS."},{"id":"7b92304c36","t":7,"q":"¿Cuál NO es una característica del NIDS?","c":"Analiza los registros (logs) del sistema operativo del equipo.","d":["Usa adaptadores de red en modo promiscuo para capturar el tráfico del segmento.","No tiene dirección IP.","Es invisible en la red."],"f":[],"cf":false,"e":"Analizar logs del host es propio del HIDS."},{"id":"09a9835eae","t":7,"q":"Un HIDS:","c":"Se instala como software en el sistema operativo del equipo que protege.","d":["Es hardware dedicado que analiza un segmento completo de la red.","Se ubica obligatoriamente en la DMZ.","Bloquea el tráfico en tiempo real con un puerto de entrada y otro de salida."],"f":[],"cf":false,"e":"HIDS = seguridad de un host. Detecta DoS, troyanos, puertas traseras, desbordamiento de búfer e intentos de acceso no autorizado."},{"id":"a8f9799aa0","t":7,"q":"¿Cuál es la debilidad de la detección basada en firmas?","c":"No detecta un ataque nuevo hasta que se carga su firma.","d":["Genera muchos falsos positivos porque el administrador define lo normal.","Necesita crear una línea base del tráfico durante un período.","Solo funciona si el equipo está en modo promiscuo."],"f":[],"cf":false,"e":"Funciona como un antivirus: requiere firmas actualizadas. Los falsos positivos son de la detección de anomalías no estadística."},{"id":"56e7f6a0e3","t":7,"q":"En un tipo de detección, el administrador define cuál es el tráfico \"normal\" y, como no hay análisis dinámico, se generan muchos falsos positivos. ¿Cuál es?","c":"Anomalías no estadística.","d":["Anomalías estadística.","Basada en firmas.","Basada en políticas."],"f":[],"cf":false,"e":"En la estadística es el IPS el que crea la línea base analizando el tráfico durante un período."},{"id":"85918d9198","t":7,"q":"El IPS analiza el tráfico durante un tiempo, arma una línea base y genera una alarma cuando el tráfico se aleja demasiado de ella. Es detección:","c":"Por anomalías estadística.","d":["Por anomalías no estadística.","Basada en firmas.","Basada en políticas."],"f":[],"cf":false,"e":"La línea base la calcula el propio sistema: es estadística."},{"id":"2bdd477c20","t":7,"q":"Un honeypot construido con máquinas reales, ubicado en la red interna de producción, donde toda interacción se considera sospechosa, es de:","c":"Alta interacción.","d":["Baja interacción.","Investigación.","Emulación."],"f":[],"cf":false,"e":"Los de baja interacción usan emulación (VMware, VirtualBox), son fáciles de mantener y tienen riesgo casi nulo."},{"id":"02653b6176","t":7,"q":"¿Cuál NO es una finalidad del honeypot?","c":"Bloquear en tiempo real el tráfico malicioso.","d":["Desviar y distraer al atacante.","Detectar nuevas vulnerabilidades y muestras de malware.","Obtener información del atacante, como su IP y los puertos que usa."],"f":[],"cf":false,"e":"El honeypot atrae y estudia. Bloquear en tiempo real es tarea del IPS."},{"id":"ab97b7a7b6","t":7,"q":"Un honeypot de investigación se diferencia de uno de producción en que:","c":"Busca estudiar tendencias y métodos de ataque en general, con fines educativos.","d":["Obtiene información de los ataques dirigidos contra la propia infraestructura.","Usa siempre máquinas reales en lugar de emulación.","Se instala como software sobre cada servidor de la empresa."],"f":[],"cf":false,"e":"El de producción informa sobre ataques contra esa infraestructura en particular."},{"id":"e64763cb7e","t":8,"q":"Una DMZ se ubica:","c":"Entre la red interna e Internet (red externa).","d":["Dentro de la red interna, detrás del firewall interno.","En Internet, fuera del control de la organización.","Entre dos VLANs de la red interna."],"f":[],"cf":false,"e":"Es una red perimetral: capa adicional entre la LAN segura y la red externa insegura."},{"id":"fb758d7abc","t":8,"q":"¿Qué servidor NO debería ubicarse en la DMZ?","c":"La base de datos interna de Recursos Humanos.","d":["El servidor web público.","El servidor de correo.","El servidor DNS público que resuelve los nombres del sitio web."],"f":[],"cf":false,"e":"En la DMZ van los servicios que se publican a Internet (web, correo, DNS, FTP)."},{"id":"4052324f4a","t":8,"q":"Si un atacante compromete el servidor web ubicado en la DMZ:","c":"La red interna sigue protegida, porque los servidores de la DMZ no tienen acceso directo a ella.","d":["Accede a toda la LAN, porque la DMZ forma parte de la red interna.","Accede a la LAN, porque las conexiones de la DMZ hacia la red interna están permitidas por diseño.","El firewall externo se desactiva automáticamente."],"f":[],"cf":false,"e":"Lo permitido es entrar a la DMZ desde la LAN y desde Internet, no salir de la DMZ hacia la LAN."},{"id":"90ac951a6a","t":8,"q":"En la estructura de una DMZ con dos firewalls, el firewall externo controla el tráfico entre:","c":"Internet y la DMZ.","d":["La DMZ y la red interna.","La red interna e Internet, sin pasar por la DMZ.","Las VLANs internas."],"f":[],"cf":false,"e":"El interno controla DMZ y red interna."},{"id":"3408b8ad39","t":8,"q":"Un vendedor se conecta desde un hotel a la red de la empresa. ¿Qué tipo de VPN usa?","c":"De acceso remoto.","d":["De sitio a sitio.","Para clientes/servicios en la nube.","Ninguna: eso es una DMZ."],"f":[],"cf":false,"e":"Acceso remoto = un usuario a la red. Sitio a sitio = dos redes."},{"id":"d43f467e1d","t":8,"q":"La casa central de Rosario se conecta de forma permanente con la sucursal de Córdoba para compartir recursos. ¿Qué tipo de VPN corresponde?","c":"De sitio a sitio.","d":["De acceso remoto.","Para clientes/servicios en la nube.","Una VPN con PPTP obligatoriamente."],"f":[],"cf":false,"e":"Conecta dos redes completas, no un usuario."},{"id":"97951fe638","t":8,"q":"¿Cuál es el protocolo VPN más antiguo y menos seguro según el material?","c":"PPTP","d":["OpenVPN","IKEv2/IPSec","L2TP/IPSec"],"f":[],"cf":false,"e":"PPTP es fácil de configurar pero el menos seguro. OpenVPN es conocido por su alta seguridad."},{"id":"7be233d87b","t":8,"q":"En L2TP/IPSec, ¿qué aporta IPSec?","c":"La encriptación.","d":["La creación del túnel.","La asignación de la IP virtual.","La autenticación del cliente mediante certificados de la CA."],"f":[],"cf":false,"e":"L2TP crea el túnel e IPSec encripta."},{"id":"820d4f7c86","t":8,"q":"¿Qué protocolo VPN se destaca por su estabilidad y rápida reconexión?","c":"IKEv2/IPSec","d":["PPTP","OpenV
